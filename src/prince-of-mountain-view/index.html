<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince of Mountain View</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<style>
  .home-link {
    position: fixed; top: 14px; left: 16px; z-index: 10;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22);
    color: rgba(255,255,255,.85); text-decoration: none;
    font-size: 13px; font-weight: 600; letter-spacing: .2px;
    backdrop-filter: blur(6px);
  }
  .home-link:hover { background: rgba(255,255,255,.2); color: #fff; }
  #wrap:fullscreen ~ .home-link, :fullscreen .home-link { display: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(160deg, #1b1440 0%, #3a1d63 45%, #b34a7c 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    border-radius: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 0 4px rgba(255,255,255,.08);
    max-width: 96vw; max-height: 86vh;
  }
  #hint {
    margin-top: 12px; color: rgba(255,255,255,.75); font-size: 13px;
    letter-spacing: .5px; text-align: center; user-select: none;
  }
  #hint b { color: #ffd45e; }
  #wrap:fullscreen {
    display: flex; align-items: center; justify-content: center;
    background: #14102a;
  }
  #wrap:fullscreen canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto; max-width: 100vw; max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
</style>
</head>
<body>
  <a href="../index.html" class="home-link">← All tools</a>
  <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="hint">
    <b>&larr;/&rarr;</b> run &nbsp;&bull;&nbsp; <b>Space</b> jump &nbsp;&bull;&nbsp; <b>Shift</b> tiptoe &nbsp;&bull;&nbsp; <b>&darr;</b> duck-dive &nbsp;&bull;&nbsp; <b>C</b> shoot &nbsp;&bull;&nbsp;
    <b>X</b> fullscreen &nbsp;&bull;&nbsp; <b>1-7</b> jump to level &nbsp;&bull;&nbsp; <b>F</b>/<b>Z</b> fun &amp; zen mode (in menu) &nbsp;&bull;&nbsp;
    <b>P</b> pause &nbsp;&bull;&nbsp; <b>M</b> mute &nbsp;&bull;&nbsp; <b>R</b> restart
  </div>
  <script src="js/audio.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
