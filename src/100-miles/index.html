<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Far Is 100 Miles? — Western States</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #f4efe6;
    --ink-dim: rgba(244,239,230,.55);
    --ink-faint: rgba(244,239,230,.28);
    --accent: #ffb25e;
    --accent-2: #ff7849;
    --card: rgba(255,255,255,.06);
    --card-line: rgba(255,255,255,.12);
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    color: var(--ink);
    background: #0b1020;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Sky — crossfaded per level */
  .sky {
    position: fixed; inset: 0;
    transition: opacity 1.1s ease;
    opacity: 0;
  }
  .sky.on { opacity: 1; }

  .stars {
    position: fixed; inset: 0; pointer-events: none;
    transition: opacity 1.1s ease;
  }

  .app {
    position: relative; z-index: 2;
    height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
  }

  /* ---------- header ---------- */
  header { text-align: center; flex-shrink: 0; }
  header h1 {
    font-size: clamp(17px, 2.4vw, 24px);
    font-weight: 800; letter-spacing: -0.4px;
  }
  header h1 em { font-style: normal; color: var(--accent); }
  header p {
    margin-top: 3px;
    font-size: clamp(11px, 1.5vw, 13px);
    color: var(--ink-dim); font-weight: 500;
  }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    flex: 1; min-height: 0;
    width: min(860px, 100%);
    display: flex; align-items: center; justify-content: center;
  }

  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    transition: transform .75s cubic-bezier(.22,.9,.3,1), opacity .6s ease;
    will-change: transform, opacity;
  }
  .scene svg {
    width: min(560px, 92%);
    height: auto;
    max-height: calc(100% - 70px);
    overflow: visible;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.45));
  }
  /* zoom-out: old object shrinks to a speck; new scene settles in from huge */
  .scene.shrink { transform: scale(.06); opacity: 0; pointer-events: none; }
  .scene.grow   { transform: scale(7);   opacity: 0; pointer-events: none; }

  .obj-name {
    font-size: clamp(18px, 2.8vw, 27px);
    font-weight: 800; letter-spacing: -0.5px;
    margin-top: 10px;
  }
  .obj-size {
    font-size: clamp(12px, 1.6vw, 14px);
    font-weight: 700; color: var(--accent);
    letter-spacing: 1.5px; text-transform: uppercase;
  }

  /* ---------- ruler ---------- */
  .ruler {
    position: fixed; right: max(10px, env(safe-area-inset-right));
    top: 50%; transform: translateY(-50%);
    z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    height: min(52vh, 420px);
  }
  .ruler-track {
    position: relative; width: 2px; flex: 1;
    background: var(--ink-faint); border-radius: 2px;
  }
  .ruler-dot {
    position: absolute; left: 50%;
    width: 9px; height: 9px; border-radius: 50%;
    transform: translate(-50%, 50%);
    background: #3a4258; border: 1.5px solid var(--ink-faint);
    cursor: pointer; transition: all .3s ease;
  }
  .ruler-dot:hover { background: var(--ink-dim); }
  .ruler-dot.active {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 12px rgba(255,178,94,.8);
    width: 12px; height: 12px;
  }
  .ruler-cap { font-size: 9.5px; font-weight: 700; color: var(--ink-faint); letter-spacing: 1px; padding: 6px 0; }

  /* ---------- info panel ---------- */
  .panel {
    flex-shrink: 0;
    width: min(660px, 100%);
    text-align: center;
  }

  .count-line {
    min-height: 54px;
    display: flex; align-items: baseline; justify-content: center; gap: 10px;
    flex-wrap: wrap;
  }
  .count-num {
    font-size: clamp(30px, 5.5vw, 48px);
    font-weight: 900; letter-spacing: -1.5px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .count-label {
    font-size: clamp(12px, 1.7vw, 15px);
    font-weight: 600; color: var(--ink-dim);
    max-width: 330px; text-align: left; line-height: 1.3;
  }

  .fact {
    margin: 10px auto 0;
    padding: 12px 18px;
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 14px;
    font-size: clamp(12.5px, 1.7vw, 14.5px);
    line-height: 1.55; color: var(--ink);
    font-weight: 450;
    backdrop-filter: blur(8px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .fact strong { color: var(--accent); font-weight: 700; }
  .panel.swap .fact, .panel.swap .count-line { opacity: 0; transform: translateY(8px); }
  .count-line { transition: opacity .5s ease, transform .5s ease; }

  /* stats grid — final level */
  .stats {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-top: 10px;
  }
  .stats.show { display: grid; }
  .stat {
    background: var(--card); border: 1px solid var(--card-line);
    border-radius: 12px; padding: 9px 6px;
  }
  .stat b { display: block; font-size: clamp(15px, 2.2vw, 20px); font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
  .stat span { font-size: clamp(9.5px, 1.3vw, 11px); font-weight: 600; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .8px; }

  /* ---------- controls ---------- */
  .controls {
    flex-shrink: 0;
    margin-top: 12px;
    display: flex; align-items: center; gap: 14px;
  }
  .btn {
    border: 1px solid var(--card-line);
    background: var(--card);
    color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 700;
    padding: 11px 22px; border-radius: 100px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: all .2s ease;
    backdrop-filter: blur(8px);
  }
  .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .btn:disabled { opacity: .25; cursor: default; transform: none; }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #2a1505; border: none;
    box-shadow: 0 6px 24px rgba(255,140,70,.35);
  }
  .btn.primary:hover { box-shadow: 0 8px 30px rgba(255,140,70,.5); }
  .btn.pulse { animation: pulse 2s ease infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 6px 24px rgba(255,140,70,.35); }
    50% { box-shadow: 0 6px 36px rgba(255,140,70,.7); }
  }
  .progress-pips { display: flex; gap: 5px; }
  .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); transition: background .3s; }
  .pip.done { background: var(--accent); }

  .hint {
    flex-shrink: 0;
    margin-top: 9px;
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: var(--ink-dim); text-transform: uppercase;
    pointer-events: none;
    transition: opacity .8s ease;
  }
  .hint.gone { opacity: 0; }

  @media (max-width: 600px) {
    .ruler { display: none; }
    .scene svg { max-height: calc(100% - 64px); }
    .stats { grid-template-columns: repeat(3, 1fr); }
    .count-label { text-align: center; }
  }
</style>
</head>
<body>

<div id="skyA" class="sky"></div>
<div id="skyB" class="sky"></div>
<canvas class="stars" id="stars"></canvas>

<div class="app">
  <header>
    <h1>How far is <em>100 miles</em>?</h1>
    <p>A zoom-out journey to the Western States Endurance Run</p>
  </header>

  <div class="stage" id="stage"></div>

  <div class="panel" id="panel">
    <div class="count-line" id="countLine">
      <span class="count-num" id="countNum"></span>
      <span class="count-label" id="countLabel"></span>
    </div>
    <div class="fact" id="fact"></div>
    <div class="stats" id="stats">
      <div class="stat"><b>18,000 ft</b><span>of climbing</span></div>
      <div class="stat"><b>23,000 ft</b><span>of descent</span></div>
      <div class="stat"><b>30 hrs</b><span>cutoff</span></div>
      <div class="stat"><b>21</b><span>aid stations</span></div>
      <div class="stat"><b>1974</b><span>first run</span></div>
      <div class="stat"><b>100°F+</b><span>in the canyons</span></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnIn">− zoom in</button>
    <div class="progress-pips" id="pips"></div>
    <button class="btn primary pulse" id="btnOut">zoom out +</button>
  </div>
  <div class="hint" id="hint">scroll, swipe or press → to zoom out</div>
</div>

<div class="ruler" id="ruler">
  <div class="ruler-cap">100 MI</div>
  <div class="ruler-track" id="rulerTrack"></div>
  <div class="ruler-cap">46 MM</div>
</div>

/* ---------------- levels ---------------- */
const LEVELS = [
  {
    id: 'watch', name: 'A GPS running watch', size: 0.046, sizeLabel: '46 mm across',
    countLabel: 'of these, laid edge to edge, to reach Auburn',
    fact: `Western States starts at <strong>5:00 a.m.</strong> in Olympic Valley, California. The fastest runners stop their watch about 14 hours later. The last official finishers cross at 10:59 the <em>next morning</em> — just inside the <strong>30-hour cutoff</strong>. Your watch battery had better be ready.`,
    sky: ['#101630', '#1a2240'], stars: .9
  },
  {
    id: 'shoe', name: 'A trail running shoe', size: 0.31, sizeLabel: '31 cm · size US 11',
    countLabel: 'shoes, heel to toe, from start to finish',
    fact: `A pair of trail shoes lasts roughly <strong>500 miles</strong> — Western States burns through a fifth of that in one day. Many runners swap shoes and socks at mile 62, after hours of dust, snowmelt and creek crossings have done their work.`,
    sky: ['#13203a', '#23304e'], stars: .7
  },
  {
    id: 'stride', name: 'One running stride', size: 1.4, sizeLabel: '~1.4 metres',
    countLabel: 'strides — around 180,000 steps once the climbs slow you to a hike',
    fact: `Every one of those steps shares <strong>18,000 ft of climbing</strong> and <strong>23,000 ft of descent</strong> — more vertical change than hiking from sea level to the top of Mont Blanc and back. The descents, not the climbs, are what wreck your quads.`,
    sky: ['#1a2c48', '#2e4368'], stars: .5
  },
  {
    id: 'track', name: 'A running track', size: 400, sizeLabel: '400 m · one lap',
    countLabel: 'laps of the track',
    fact: `Western States ends with <strong>300 metres on the Placer High School track</strong> in Auburn — the most famous finishing lap in ultrarunning. 161,000 metres of mountains, and the last 300 are on a track like this one.`,
    sky: ['#23395c', '#3d5a85'], stars: .25
  },
  {
    id: 'parkrun', name: 'A 5K parkrun', size: 5000, sizeLabel: '5 km',
    countLabel: 'parkruns, back to back, on mountain trails',
    fact: `The very first of those 32 "parkruns" climbs the <strong>Escarpment: 2,550 ft of vertical in the opening 4½ miles</strong>, often over snow — from the valley floor to Watson Monument at 8,750 ft, the highest point of the course.`,
    sky: ['#2a4a6e', '#4a7298'], stars: 0
  },
  {
    id: 'marathon', name: 'A marathon', size: 42195, sizeLabel: '42.2 km · 26.2 mi',
    countLabel: 'marathons, one after another',
    fact: `Marathon two and three run through <strong>the canyons</strong> — Deadwood, El Dorado, Volcano — where afternoon temperatures regularly top <strong>100&nbsp;°F (38&nbsp;°C)</strong>. Runners stuff ice in their hats at all 21 aid stations and wade into creeks to cool off.`,
    sky: ['#3d4668', '#6e5a72'], stars: 0
  },
  {
    id: 'hundredk', name: 'A 100K ultramarathon', size: 100000, sizeLabel: '100 km · 62 mi',
    countLabel: 'of a full 100K… and then a bit more',
    fact: `At <strong>Foresthill, mile 62</strong>, you've run a full 100K — a huge race in its own right. At Western States it's just "the start of the running section": <strong>61 km still to go</strong>, including the Rucky Chucky river crossing at mile 78, usually by glow-stick light in the dark.`,
    sky: ['#46315a', '#7a4a55'], stars: .15
  },
  {
    id: 'ws100', name: 'Western States 100', size: WS_METERS, sizeLabel: '161.3 km · 100.2 miles',
    countLabel: '',
    fact: `Born in <strong>1974</strong>, when Gordy Ainsleigh's horse went lame before the Tevis Cup trail ride — so he ran the whole trail on foot in 23:42. Finish under 24 hours and you earn the <strong>silver buckle</strong>. It's the distance from San Francisco to Sacramento… over the Sierra Nevada.`,
    sky: ['#0d1226', '#1c1430'], stars: 1
  }
];

/* ---------------- state & dom ---------------- */
let idx = 0;
let animating = false;
const stage = document.getElementById('stage');
const panel = document.getElementById('panel');
const countNum = document.getElementById('countNum');
const countLabelEl = document.getElementById('countLabel');
const factEl = document.getElementById('fact');
const statsEl = document.getElementById('stats');
const btnIn = document.getElementById('btnIn');
const btnOut = document.getElementById('btnOut');
const pipsEl = document.getElementById('pips');
const hint = document.getElementById('hint');
const skyA = document.getElementById('skyA');
const skyB = document.getElementById('skyB');
let skyFlip = false;

/* pips */
LEVELS.forEach(() => {
  const p = document.createElement('div');
  p.className = 'pip';
  pipsEl.appendChild(p);
});

/* ruler dots on a log scale */
const rulerTrack = document.getElementById('rulerTrack');
const logMin = Math.log10(LEVELS[0].size);
const logMax = Math.log10(WS_METERS);
LEVELS.forEach((lv, i) => {
  const d = document.createElement('div');
  d.className = 'ruler-dot';
  const t = (Math.log10(lv.size) - logMin) / (logMax - logMin);
  d.style.bottom = (t * 100) + '%';
  d.title = lv.name;
  d.addEventListener('click', () => goTo(i));
  rulerTrack.appendChild(d);
});

/* ---------------- helpers ---------------- */
function fmtCount(n) {
  if (n >= 1000) return Math.round(n).toLocaleString('en-US');
  if (n >= 100) return String(Math.round(n));
  return (Math.round(n * 10) / 10).toLocaleString('en-US', { maximumFractionDigits: 1 });
}

let counterRAF = 0;
function animateCount(target) {
  cancelAnimationFrame(counterRAF);
  const t0 = performance.now(), dur = 950;
  const from = target / 4;
  function tick(t) {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    countNum.textContent = '× ' + fmtCount(from + (target - from) * e);
    if (k < 1) counterRAF = requestAnimationFrame(tick);
  }
  counterRAF = requestAnimationFrame(tick);
}

function buildScene(lv) {
  const s = document.createElement('div');
  s.className = 'scene';
  s.innerHTML = `${SVGs[lv.id]}
    <div class="obj-name">${lv.name}</div>
    <div class="obj-size">${lv.sizeLabel}</div>`;
  return s;
}

function setSky(lv) {
  const next = skyFlip ? skyA : skyB;
  const prev = skyFlip ? skyB : skyA;
  next.style.background = `linear-gradient(180deg, ${lv.sky[0]}, ${lv.sky[1]})`;
  next.classList.add('on');
  prev.classList.remove('on');
  skyFlip = !skyFlip;
  document.getElementById('stars').style.opacity = lv.stars;
}

function renderPanel(lv) {
  const isFinal = lv.id === 'ws100';
  if (isFinal) {
    cancelAnimationFrame(counterRAF);
    countNum.textContent = '100.2 miles.';
    countLabelEl.textContent = 'One day. One belt buckle.';
  } else {
    animateCount(WS_METERS / lv.size);
    countLabelEl.textContent = lv.countLabel;
  }
  factEl.innerHTML = lv.fact;
  statsEl.classList.toggle('show', isFinal);
}

function updateChrome() {
  btnIn.disabled = idx === 0;
  btnOut.disabled = idx === LEVELS.length - 1;
  btnOut.classList.toggle('pulse', idx === 0);
  [...pipsEl.children].forEach((p, i) => p.classList.toggle('done', i <= idx));
  [...rulerTrack.children].forEach((d, i) => d.classList.toggle('active', i === idx));
}

/* ---------------- transitions ---------------- */
function goTo(target) {
  if (animating || target === idx || target < 0 || target >= LEVELS.length) return;
  animating = true;
  hint.classList.add('gone');

  const zoomOut = target > idx;
  const oldScene = stage.querySelector('.scene');
  const lv = LEVELS[target];
  idx = target;

  const next = buildScene(lv);
  next.classList.add(zoomOut ? 'grow' : 'shrink');
  stage.appendChild(next);

  panel.classList.add('swap');
  setSky(lv);
  updateChrome();

  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (oldScene) oldScene.classList.add(zoomOut ? 'shrink' : 'grow');
    next.classList.remove('grow', 'shrink');
  }));

  setTimeout(() => {
    renderPanel(lv);
    panel.classList.remove('swap');
  }, 380);

  setTimeout(() => {
    if (oldScene) oldScene.remove();
    animating = false;
  }, 800);
}

/* ---------------- input ---------------- */
btnOut.addEventListener('click', () => goTo(idx + 1));
btnIn.addEventListener('click', () => goTo(idx - 1));

window.addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowUp', ' ', '+', '='].includes(e.key)) { e.preventDefault(); goTo(idx + 1); }
  if (['ArrowLeft', 'ArrowDown', '-', '_'].includes(e.key)) { e.preventDefault(); goTo(idx - 1); }
});

let wheelAcc = 0, wheelLock = false;
window.addEventListener('wheel', e => {
  e.preventDefault();
  if (wheelLock) return;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) > 90) {
    goTo(idx + (wheelAcc > 0 ? 1 : -1));
    wheelAcc = 0;
    wheelLock = true;
    setTimeout(() => { wheelLock = false; }, 850);
  }
}, { passive: false });

let touchY = null;
window.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', e => {
  if (touchY === null) return;
  const dy = touchY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 55) goTo(idx + (dy > 0 ? 1 : -1));
  touchY = null;
}, { passive: true });

/* ---------------- stars ---------------- */
const cvs = document.getElementById('stars');
const ctx = cvs.getContext('2d');
let starField = [];
function seedStars() {
  cvs.width = innerWidth * devicePixelRatio;
  cvs.height = innerHeight * devicePixelRatio;
  starField = Array.from({ length: 130 }, () => ({
    x: Math.random() * cvs.width,
    y: Math.random() * cvs.height * .72,
    r: (Math.random() * 1.1 + .3) * devicePixelRatio,
    p: Math.random() * Math.PI * 2,
    v: .4 + Math.random() * 1.2
  }));
}
function drawStars(t) {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.fillStyle = '#e9ecf5';
  for (const s of starField) {
    ctx.globalAlpha = .25 + .55 * (0.5 + 0.5 * Math.sin(s.p + t / 1000 * s.v));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
seedStars();
window.addEventListener('resize', seedStars);
requestAnimationFrame(drawStars);

/* ---------------- init ---------------- */
const first = LEVELS[0];
stage.appendChild(buildScene(first));
setSky(first);
renderPanel(first);
updateChrome();
</script>
