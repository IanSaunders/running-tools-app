  const SHEET_CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET.id}/gviz/tq?tqx=out:csv&gid=${SHEET.gid}`;
  // Hardcoded write endpoint: the Apps Script web-app /exec URL bound to this sheet.
  // Deploy the script in CLAUDE.md (Extensions → Apps Script → Deploy → Web app) and paste
  // its /exec URL here. Once set, every crew device pushes Adjust +/- min automatically —
  // nobody has to enter anything. A per-device URL on the Data tab overrides this.
  const SHEET_WRITE_URL = "https://script.google.com/macros/s/AKfycbxmOGapx1mlqfbX-Qx3MGv1J5rhwgu_h-j9_ce1JIl4wrdokc_lJgw_1vWulQAlGbEaFA/exec";
  const writeEndpoint = () => DEMO_MODE ? "" : ((state.writeUrl && state.writeUrl.trim()) || SHEET_WRITE_URL);

  // Stops where the crew physically has access (drives the "Next crew stop" card).
  const CREW_ACCESS = ["start", "robinson", "michigan", "foresthill", "rucky", "green gate", "highway 49", "finish"];
  const isCrew = (name) => { const n = (name||"").toLowerCase(); return CREW_ACCESS.some(k => n.includes(k)); };

  // Per-crew-stop logistics: approximate parking coordinates + tips for real-time planning.
  // Coords are best-effort and EDITABLE in-app — verify against the official WS crew guide.
  // `key` matches the station name (lowercase substring).
  const CREW_INFO = [
    { key:"olympic", lat:39.1968, lng:-120.2357, park:"Olympic Valley / Palisades Tahoe base area.",
      tips:"5:00 AM start. Cold up high — have warm throwaway layers. Sort drop bags and your plan to reach Robinson Flat (first crew access, mile 30)." },
    { key:"robinson", lat:39.1544, lng:-120.5006, park:"No private vehicles to the aid station — ride the official crew shuttle from Foresthill. Check the shuttle schedule and leave early.",
      tips:"First crew access (mi 30) after a long, dusty, often hot stretch — and the brutal canyons come next. Load ice, cold fluids, calories, cooling. Drop-bag stop. Keep it efficient." },
    { key:"michigan", lat:39.0386, lng:-120.7375, park:"Michigan Bluff — follow race parking; narrow roads, arrive early.",
      tips:"Mi 55, right after the three big canyons — runner often arrives hot and depleted. Core cooling + calories + stomach check first. Pacers NOT allowed yet (Foresthill is pickup)." },
    { key:"foresthill", lat:39.0188, lng:-120.8172, park:"Foresthill — follow signs near Foresthill Elementary / Foresthill Rd.",
      tips:"Mi 62 — major hub and PACER pickup. Hand off night kit (headlamp, layers, backup light), restock for the long California St descent. Last easy road access for a while." },
    { key:"rucky", lat:38.9939, lng:-120.9430, park:"River crossing — generally NO crew vehicle access. Crew/pacers reach this side via the Green Gate shuttle; confirm in the crew guide.",
      tips:"Mi 78, the river crossing. Expect wet feet; have a dry-sock/shoe option and a warm layer ready if you can get here." },
    { key:"green gate", lat:38.9980, lng:-120.9290, park:"Pacer/crew access via shuttle only — no direct road. Confirm access in the crew guide.",
      tips:"Mi 80, top of the climb out of the river. Post-river reset: dry socks, lights check, calories. Long runnable night section follows." },
    { key:"highway 49", lat:38.9189, lng:-121.0228, park:"Hwy 49 Crossing — designated crew parking/shuttle near Auburn; arrive early, it gets busy.",
      tips:"Mi 93, late-night/early-AM. Reassure and assess: stomach, lights, feet. Climb then runnable to No Hands Bridge. Almost home." },
    { key:"finish", lat:38.8966, lng:-121.0769, park:"Placer High School, Auburn — finish-line parking per race info.",
      tips:"The finish on the Placer HS track. Have warm/dry clothes, recovery food/drink, a chair. Final 1.3 mi from Robie Point: road climb, then a lap of the track." },
  ];
  const crewInfo = (name) => { const n = (name||"").toLowerCase(); return CREW_INFO.find(c => n.includes(c.key)) || null; };
  function stationCoords(name) {
    const ss = state.stations[name] || {};
    if (ss.lat != null && ss.lng != null) return { lat: ss.lat, lng: ss.lng, custom: true };
    const ci = crewInfo(name); return ci ? { lat: ci.lat, lng: ci.lng, custom: false } : null;
  }
  const mapsUrl = (lat, lng) => `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

  // Embedded snapshot of "Crew - app" (offline default; refreshed from live sheet on load).
  const SHEET_SNAPSHOT = [
    { mile:0,     name:"Start - Olympic Valley",     eta:"Sat 5:00 AM",  leaveBy:"Sat 5:00 AM",  stopGoal:"Calm start; no hero pace.",                    haveReady:"Start kit, bottles, breakfast/caffeine plan.",                 notes:"" },
    { mile:15.8,  name:"Red Star Ridge",             eta:"Sat 8:05 AM",  leaveBy:"Sat 8:07 AM",  stopGoal:"Early check; keep stop short.",                haveReady:"Fluids, quick calories, sunscreen/cooling if needed.",         notes:"" },
    { mile:30.3,  name:"Robinson Flat",              eta:"Sat 10:50 AM", leaveBy:"Sat 10:56 AM", stopGoal:"Major reset; keep stop efficient.",            haveReady:"Bottles, calories, ice/cooling, lube/socks if needed.",        notes:"" },
    { mile:38,    name:"Dusty Corners",              eta:"Sat 12:15 PM", leaveBy:"Sat 12:19 PM", stopGoal:"Cool aggressively; send out eating/drinking.", haveReady:"Ice, cold fluids, calories, hat/bandana cooling.",             notes:"" },
    { mile:47.8,  name:"Devil's Thumb",              eta:"Sat 2:10 PM",  leaveBy:"Sat 2:14 PM",  stopGoal:"Short controlled stop after climb.",           haveReady:"Cooling, fluids, calories, quick status check.",               notes:"" },
    { mile:55.7,  name:"Michigan Bluff",             eta:"Sat 3:45 PM",  leaveBy:"Sat 3:50 PM",  stopGoal:"Crew reset; prepare for Foresthill/pacer.",    haveReady:"Bottles, calories, cooling, stomach check.",                   notes:"" },
    { mile:62,    name:"Foresthill",                 eta:"Sat 5:00 PM",  leaveBy:"Sat 5:08 PM",  stopGoal:"Major reset; launch with pacer.",              haveReady:"Headlamp/night kit, pacer handoff, calories, fluids, cooling.",notes:"" },
    { mile:70.7,  name:"Peachstone / Cal 2",         eta:"Sat 6:40 PM",  leaveBy:"Sat 6:43 PM",  stopGoal:"Keep moving; avoid lingering.",                haveReady:"Quick refill, calories, cooling if needed.",                   notes:"" },
    { mile:78,    name:"Rucky Chucky Far",           eta:"Sat 8:05 PM",  leaveBy:"Sat 8:10 PM",  stopGoal:"River prep; quick and calm.",                  haveReady:"Refill bottles, warm layer if needed, follow crossing instructions.", notes:"" },
    { mile:79.8,  name:"Green Gate",                 eta:"Sat 8:30 PM",  leaveBy:"Sat 8:35 PM",  stopGoal:"Post-river reset.",                            haveReady:"Dry socks/shoes if useful, bottles, calories, lights check.",  notes:"" },
    { mile:85.2,  name:"Auburn Lake Trails",         eta:"Sat 9:35 PM",  leaveBy:"Sat 9:40 PM",  stopGoal:"Night check; keep moving.",                    haveReady:"Calories, caffeine only if planned, fluids, warm layer option.",notes:"" },
    { mile:90.7,  name:"Quarry Road",                eta:"Sat 10:45 PM", leaveBy:"Sat 10:48 PM", stopGoal:"Very quick in/out.",                           haveReady:"Final fluids/calories; remind last runnable push.",            notes:"" },
    { mile:93.5,  name:"Highway 49",                 eta:"Sat 11:20 PM", leaveBy:"Sat 11:23 PM", stopGoal:"Assess and reassure.",                         haveReady:"Stomach check, lights check, climb/run reminder.",             notes:"" },
    { mile:94.3,  name:"Pointed Rocks",              eta:"Sat 11:25 PM", leaveBy:"Sat 11:28 PM", stopGoal:"Last reset; commit to finish.",                haveReady:"Final sip/calories, confidence, nothing complicated.",         notes:"" },
    { mile:99.5,  name:"Robie Point",                eta:"Sun 12:20 AM", leaveBy:"Sun 12:20 AM", stopGoal:"Power up, then run home.",                      haveReady:"Encouragement only; no long stop.",                            notes:"" },
    { mile:100.2, name:"Finish - Placer HS Track",   eta:"Sun 12:30 AM", leaveBy:"Sun 12:30 AM", stopGoal:"Finish.",                                      haveReady:"Meet at finish.",                                              notes:"" },
  ];

  /* ── Course (rebuilt from sheet rows) ──────────────────────────────────── */
  const WD = { sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6 };
  // "Sat 5:00 AM" -> { wd, tod(minutes) }   (wd null if no weekday present)
  function parseDayTime(s) {
    if (!s) return null;
    const m = String(s).toLowerCase().match(/(sun|mon|tue|wed|thu|fri|sat)?\s*(\d{1,2}):(\d{2})\s*(am|pm)/);
    if (!m) return null;
    let h = (+m[2]) % 12; if (m[4] === "pm") h += 12;
    return { wd: m[1] != null ? WD[m[1]] : null, tod: h * 60 + (+m[3]) };
  }
  let COURSE = { name:"Western States 100", distance:100.2, stations:[] };
  let PLAN_FINISH = 0;

  function buildCourse(rows) {
    if (!Array.isArray(rows) || rows.length === 0) {
      COURSE = { name:"Western States 100", distance:0, stations:[] };
      PLAN_FINISH = 0;
      return false;
    }
    rows = rows.filter(r => r && r.name && !isNaN(parseFloat(r.mile)));
    if (!rows.length) {
      COURSE = { name:"Western States 100", distance:0, stations:[] };
      PLAN_FINISH = 0;
      return false;
    }
    const startDT = parseDayTime(rows[0].eta) || { wd:6, tod:300 };
    const stations = rows.map(r => {
      const dt = parseDayTime(r.eta);
      let planned = 0;
      if (dt) {
        const dayDiff = dt.wd == null ? 0 : ((dt.wd - startDT.wd + 7) % 7);
        planned = dayDiff * 1440 + dt.tod - startDT.tod;
      }
      return {
        name: r.name, mile: +r.mile, crew: isCrew(r.name),
        etaText: r.eta, leaveBy: r.leaveBy, plannedElapsed: planned,
        stopGoal: r.stopGoal || "", haveReady: r.haveReady || "", crewNotes: r.notes || "",
      };
    });
    COURSE = { name:"Western States 100", distance:+rows[rows.length-1].mile, stations };
    PLAN_FINISH = stations[stations.length - 1].plannedElapsed;
    // start time-of-day from the plan, unless the user overrode it
    if (!state.startTimeUserSet) state.startTime = pad(Math.floor(startDT.tod/60)) + ":" + pad(startDT.tod%60);
    return true;
  }

  /* ── State ─────────────────────────────────────────────────────────────── */
  const STORE_KEY = DEMO_MODE ? "ws-crew-demo-state-v1" : "ws-crew-state-v2";
  const defaultState = () => ({
    runnerName: "",
    goalMin: null,              // null => use the sheet plan finish
    startDate: "2026-06-27",    // WS 2026 race day (Saturday)
    startTime: "05:00",
    startTimeUserSet: false,
    stations: {},               // name -> { adjust, actual, reached, note, lat, lng }
    writeUrl: "",               // Apps Script web-app URL (optional)
    paceGoalMin: null,          // selected goal on Pace tab (null => plan)
    paceFromHere: false,
    units: "imperial",          // "imperial" (mi, /mi) | "metric" (km, /km)
    lastSync: 0,
    demoSeeded: false,
  });
  let state = load();
  let dataState = {
    kind: DEMO_MODE ? "demo" : "snapshot",
    message: DEMO_MODE ? "Demo mode uses local sample progress. Sheet writes are disabled." : "Using embedded plan until the sheet responds.",
    source: DEMO_MODE ? "Demo data" : "Embedded plan",
    lastAttempt: 0,
  };
  let offlineState = { supported:"serviceWorker" in navigator, ready:false, message:"Not prepared yet." };
  let activeTab = "track";
  let expanded = null;
  let flash = null;   // {name, msg, kind} — transient status shown in a station editor after Save

  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) return Object.assign(defaultState(), JSON.parse(raw)); } catch (e) {}
    return defaultState();
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
  function stStation(name) { if (!state.stations[name]) state.stations[name] = { adjust:0, actual:null }; return state.stations[name]; }
  function goal() { return state.goalMin || PLAN_FINISH; }
  function paceGoal() { return state.paceGoalMin || PLAN_FINISH; }
  function hasCourse() { return COURSE.stations.length > 0; }
  function lastTimedRow(p) {
    for (let i = p.rows.length - 1; i >= 0; i--) if (p.rows[i].timed) return p.rows[i];
    return null;
  }
  function applyDemoSeed() {
    if (!DEMO_MODE || state.demoSeeded) return;
    state.runnerName = state.runnerName || "Demo Runner";
    state.goalMin = state.goalMin || PLAN_FINISH;
    state.stations = Object.assign({}, state.stations, {
      "Start - Olympic Valley": Object.assign(stStation("Start - Olympic Valley"), { actual: 0, reached: true, adjust: 0 }),
      "Red Star Ridge": Object.assign(stStation("Red Star Ridge"), { actual: 193, reached: true, adjust: 0 }),
      "Robinson Flat": Object.assign(stStation("Robinson Flat"), { actual: 355, reached: true, adjust: 0 }),
      "Dusty Corners": Object.assign(stStation("Dusty Corners"), { reached: true, actual: null, adjust: 0 }),
    });
    state.demoSeeded = true;
    save();
  }
  function saveLastSheet(courseRows, adjustByName) {
    try {
      localStorage.setItem(LAST_SHEET_KEY, JSON.stringify({ savedAt: Date.now(), courseRows, adjustByName }));
    } catch (e) {}
  }
  function loadLastSheet() {
    try {
      const raw = localStorage.getItem(LAST_SHEET_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function mergeSheetAdjustments(adjustByName, replace) {
    if (replace) {
      const ns = {};
      Object.entries(state.stations).forEach(([nm, ss]) => {
        if (ss && (ss.note || ss.lat != null || ss.lng != null)) ns[nm] = { adjust:0, actual:null, reached:false, note:ss.note, lat:ss.lat, lng:ss.lng };
      });
      Object.entries(adjustByName || {}).forEach(([nm, a]) => { ns[nm] = Object.assign(ns[nm]||{}, { adjust: a, actual: null, reached: true }); });
      state.stations = ns;
      return;
    }
    Object.entries(adjustByName || {}).forEach(([nm, a]) => {
      const ss = stStation(nm);
      ss.adjust = a;
      ss.reached = true;
      if (ss.actual == null) ss.actual = null;
    });
  }

  /* ── Units (imperial ⇄ metric) ─────────────────────────────────────────── */
  const KM_PER_MI = 1.609344;
  const isMetric = () => state.units === "metric";
  const distU = () => isMetric() ? "km" : "mi";
  const toDist = (mi) => isMetric() ? mi * KM_PER_MI : mi;            // miles → display unit
  const fmtDist = (mi, dp=1) => toDist(mi).toFixed(dp) + " " + distU();
  const paceU = () => isMetric() ? "/km" : "/mi";
  const toPace = (minPerMi) => isMetric() ? minPerMi / KM_PER_MI : minPerMi; // min/mi → min/display-unit
  const fmtPaceU = (minPerMi) => fmtPace(toPace(minPerMi)) + paceU();

  // Move the runner's current position forward/back without needing a logged time.
  // Forward marks the next stop "reached"; back clears the furthest reached/timed stop.
  function advanceRunner(dir) {
    if (!hasCourse()) return;
    const p = project();
    if (dir > 0) {
      const ni = p.lastDoneIdx + 1;
      if (ni < COURSE.stations.length) { const nm = COURSE.stations[ni].name; const ss = stStation(nm); if (ss.actual == null) ss.reached = true; save(); if (writeEndpoint()) pushStationToSheet(nm, null); }
    } else if (p.lastDoneIdx >= 0) {
      const nm = COURSE.stations[p.lastDoneIdx].name; const ss = stStation(nm); ss.reached = false; ss.actual = null; ss.adjust = 0; save(); clearStationInSheet(nm);
    }
    expanded = null; flash = null; render(); openTab(activeTab);
  }

  /* ── Time helpers ──────────────────────────────────────────────────────── */
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmtElapsed(min) {
    if (min == null || isNaN(min)) return "—";
    const neg = min < 0; min = Math.abs(Math.round(min));
    return (neg ? "-" : "") + Math.floor(min / 60) + ":" + pad(min % 60);
  }
  function fmtDelta(min) {
    if (min == null || isNaN(min)) return "—";
    const r = Math.round(min); if (r === 0) return "even";
    return (r > 0 ? "+" : "") + r;
  }
  function fmtPace(p) {
    if (p == null || isNaN(p) || !isFinite(p)) return "—";
    const m = Math.floor(p), s = Math.round((p - m) * 60);
    return (s === 60 ? (m+1) + ":00" : m + ":" + pad(s));
  }
  function startDate() {
    const [hh, mm] = (state.startTime || "05:00").split(":").map(Number);
    let d;
    if (state.startDate) { const [y,mo,da] = state.startDate.split("-").map(Number); d = new Date(y, mo-1, da); }
    else { d = new Date(); }
    d.setHours(hh, mm, 0, 0); return d;
  }
  function clockFromElapsed(min) {
    if (min == null || isNaN(min)) return { time:"—", day:"" };
    const d = new Date(startDate().getTime() + min * 60000);
    let h = d.getHours(); const m = d.getMinutes();
    const ap = h >= 12 ? "PM" : "AM"; h = h % 12; if (h === 0) h = 12;
    const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    return { time: h + ":" + pad(m) + " " + ap, day: dayNames[d.getDay()] };
  }
  function elapsedFromClock(hhmm, nearElapsed) {
    if (!hhmm) return null;
    const [hh, mm] = hhmm.split(":").map(Number);
    const base = new Date(startDate()); base.setHours(hh, mm, 0, 0);
    let best = null, bestErr = Infinity;
    for (let dayOff = 0; dayOff <= 2; dayOff++) {
      const cand = (base.getTime() + dayOff*86400000 - startDate().getTime()) / 60000;
      if (cand < -1) continue;
      const err = Math.abs(cand - (nearElapsed ?? 0));
      if (err < bestErr) { bestErr = err; best = cand; }
    }
    return best == null ? null : Math.round(best);
  }
  function clock24FromElapsed(min) {
    const d = new Date(startDate().getTime() + min*60000);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /* ── Plan / projection engine ──────────────────────────────────────────── */
  function plannedSplits() { return COURSE.stations.map(s => s.plannedElapsed); }

  // Full projection: actuals override and carry forward; per-stop adjust carries forward.
  function project() {
    if (!hasCourse()) return { rows:[], lastDoneIdx:-1, nextIdx:-1 };
    const planned = plannedSplits();
    const rows = []; let runningOffset = 0; let lastDoneIdx = -1;
    COURSE.stations.forEach((s, i) => {
      const ss = state.stations[s.name] || { adjust:0, actual:null, reached:false };
      let projected;
      if (ss.actual != null) { projected = ss.actual; runningOffset = projected - planned[i]; }
      else { projected = planned[i] + runningOffset + (ss.adjust || 0); if (ss.adjust) runningOffset += ss.adjust; }
      const done = ss.actual != null || !!ss.reached;
      if (done) lastDoneIdx = i;
      rows.push({ idx:i, station:s, planned:planned[i], projected, actual:ss.actual, adjust:ss.adjust||0,
        delta:projected - planned[i], isDone:done, timed:ss.actual != null, reached:!!ss.reached });
    });
    const nextIdx = lastDoneIdx + 1 < rows.length ? lastDoneIdx + 1 : rows.length - 1;
    rows.forEach(r => r.isCurrent = (r.idx === nextIdx && lastDoneIdx < rows.length - 1));
    // incremental adjust at each stop (what gets written to "Adjust +/- min")
    let prevDelta = 0;
    rows.forEach(r => { r.incAdjust = Math.round(r.delta - prevDelta); prevDelta = r.delta; });
    return { rows, lastDoneIdx, nextIdx };
  }

  /* ── Rendering ─────────────────────────────────────────────────────────── */
  const $ = (s, r=document) => r.querySelector(s);
  function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function deltaClass(min) { if (min == null || isNaN(min)) return "even"; const r = Math.round(min); return r > 0 ? "behind" : r < 0 ? "ahead" : "even"; }
  function goalLabel(min) { if (min == null || !isFinite(min) || min <= 0) return "—"; const h = Math.floor(min/60), m = Math.round(min%60); return m === 0 ? h + ":00" : h + ":" + pad(m); }
  function parseHM(s) {
    const m = String(s).trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) { const n = parseFloat(s); return isNaN(n)?null:Math.round(n*60); }
    return (+m[1])*60 + (+m[2]);
  }
  function dataSummary() {
    if (DEMO_MODE) return { label:"Demo mode", cls:"demo", dot:"demo", detail:"Writes disabled", source:"Demo data" };
    if (dataState.kind === "loading") return { label:"Loading sheet", cls:"warn", dot:"stale", detail:"Refreshing live plan", source:"Sheet" };
    if (dataState.kind === "empty") return { label:"Empty sheet", cls:"warn", dot:"stale", detail:"Using embedded plan", source:"Embedded plan" };
    if (dataState.kind === "error") return { label:"Sheet error", cls:"err", dot:"off", detail:"Using saved plan", source:dataState.source || "Saved plan" };
    if (dataState.kind === "cached") return { label:"Saved sheet", cls:"warn", dot:"stale", detail:dataState.savedAt ? "Saved " + clockFromAbs(dataState.savedAt) : "Saved on device", source:"Last saved sheet" };
    if (state.lastSync && Date.now() - state.lastSync > STALE_AFTER_MS) return { label:"Stale", cls:"warn", dot:"stale", detail:"Last sync " + clockFromAbs(state.lastSync), source:"Sheet" };
    if (state.lastSync) return { label:"Synced", cls:"ok", dot:"", detail:clockFromAbs(state.lastSync), source:"Sheet" };
    return { label:"Embedded plan", cls:"warn", dot:"stale", detail:"Waiting for sheet", source:"Embedded plan" };
  }
  function statusPill() {
    const ds = dataSummary();
    return `<span class="status-pill ${ds.cls}">${esc(ds.label)}</span>`;
  }
  function emptyCourseCard(message) {
    return el(`<div class="card empty-card">
      <h2>No course data loaded</h2>
      <p>${esc(message || "The app could not build a station list. Refresh from the Data tab or check the embedded snapshot and sheet columns.")}</p>
      <div class="empty-actions">
        <button class="btn" id="empty-refresh">Refresh from sheet</button>
        <button class="btn ghost" id="empty-data">Open Data tab</button>
      </div>
    </div>`);
  }
  function attachEmptyActions(card) {
    const refresh = card.querySelector("#empty-refresh");
    const data = card.querySelector("#empty-data");
    if (refresh) refresh.onclick = () => pullFromSheet(null, true, true);
    if (data) data.onclick = () => openTab("data");
  }
  function nowElapsedNear(nearElapsed) {
    return elapsedFromClock(pad(new Date().getHours()) + ":" + pad(new Date().getMinutes()), nearElapsed);
  }
  function fmtUntil(min) {
    if (min == null || !isFinite(min)) return "—";
    const diff = Math.round((startDate().getTime() + min * 60000 - Date.now()) / 60000);
    if (Math.abs(diff) < 1) return "now";
    return diff > 0 ? "in " + fmtElapsed(diff) : fmtElapsed(-diff) + " ago";
  }
  function deviceGuide() {
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);
    if (isIOS) {
      return {
        title:"iPhone / iPad",
        steps:["Tap Prepare offline use while you still have signal.", "Tap the Safari Share button.", "Choose Add to Home Screen, then Add.", "Open that Home Screen icon once before race day."]
      };
    }
    if (isAndroid) {
      return {
        title:"Android Chrome",
        steps:["Tap Prepare offline use while you still have signal.", "Open the Chrome menu.", "Choose Add to Home screen or Install app.", "Open the installed icon once before race day."]
      };
    }
    return {
      title:"Browser",
      steps:["Tap Prepare offline use while online.", "Keep this page bookmarked or pinned.", "Reloading can use the local cache if the network drops."]
    };
  }
  function offlineGuideHtml() {
    const g = deviceGuide();
    return `<div class="offline-guide"><h3>${esc(g.title)} setup</h3><ol>${g.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`;
  }
  async function prepareOfflineUse(status) {
    if (!("serviceWorker" in navigator)) {
      offlineState = { supported:false, ready:false, message:"This browser does not support offline caching." };
      setStatus(status, offlineState.message, "err");
      return;
    }
    setStatus(status, "Preparing offline cache…", "muted");
    try {
      const reg = await navigator.serviceWorker.register("./sw.js", { scope:"./" });
      await navigator.serviceWorker.ready;
      if (reg.active) reg.active.postMessage({ type:"CACHE_NOW" });
      offlineState = { supported:true, ready:true, message:"Offline cache ready. Open this page once before race day; later refreshes can load without signal." };
      setStatus(status, offlineState.message, "ok");
    } catch (e) {
      offlineState = { supported:true, ready:false, message:"Offline setup failed: " + e.message };
      setStatus(status, offlineState.message, "err");
    }
  }
  async function initOfflineUse() {
    if (!("serviceWorker" in navigator)) {
      offlineState = { supported:false, ready:false, message:"This browser does not support offline caching." };
      return;
    }
    try {
      await navigator.serviceWorker.register("./sw.js", { scope:"./" });
      await navigator.serviceWorker.ready;
      offlineState = { supported:true, ready:true, message:"Offline cache ready." };
      render(); openTab(activeTab);
    } catch (e) {
      offlineState = { supported:true, ready:false, message:"Offline cache not ready yet." };
    }
  }

  function render() {
    renderTrack(); renderPace(); renderSplits(); renderData();
    const ds = dataSummary();
    const sync = `<span class="dot ${ds.dot}">●</span> ${esc(ds.label)}${ds.detail ? " · " + esc(ds.detail) : ""}`;
    $("#raceSub").innerHTML = (state.runnerName ? esc(state.runnerName) + " · " : "") + sync;
  }
  function clockFromAbs(ts) {
    const d = new Date(ts); let h = d.getHours(); const m = d.getMinutes();
    const ap = h >= 12 ? "PM":"AM"; h = h%12; if (h===0) h=12; return h+":"+pad(m)+" "+ap;
  }

  // Parking "Open in Maps" + note, and curated tips + crew's own note.
  function parkingBlock(name) {
    const c = stationCoords(name); if (!c) return '';
    const ci = crewInfo(name);
    const parkText = (ci?.park || "").toLowerCase();
    const limited = /shuttle|no private|no direct|river/.test(parkText);
    return `<div class="parkrow">
      <a class="maps-btn" href="${mapsUrl(c.lat, c.lng)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Parking in Maps
      </a>
      <span class="access-pill ${limited?'warn':''}">${limited?'Limited access':'Crew parking'}</span>
      <span class="park-note">${ci?esc(ci.park)+' ':''}${c.custom?'<b>(your pin)</b>':'<span class="approx">approx — verify</span>'}</span>
    </div>`;
  }
  function tipsBlock(name) {
    const ci = crewInfo(name); const ss = state.stations[name] || {};
    const note = ss.note ? `<div class="crewnote"><b>Your note:</b> ${esc(ss.note)}</div>` : '';
    if (!ci && !note) return '';
    return `<div class="tips">${ci?`<div class="tips-k">Crew tips</div><div class="tips-v">${esc(ci.tips)}</div>`:''}${note}</div>`;
  }

  /* ---- TRACK ---- */
  function renderTrack() {
    const v = $("#view-track"); v.innerHTML = "";
    if (!hasCourse()) {
      const card = emptyCourseCard(dataState.message);
      v.appendChild(card); attachEmptyActions(card);
      return;
    }
    const p = project();
    const finishRow = p.rows[p.rows.length - 1];
    const projFinish = finishRow.projected;
    const goalDelta = projFinish - goal();
    const lastDone = p.lastDoneIdx >= 0 ? p.rows[p.lastDoneIdx] : null;
    const nextCrew = p.rows.find(r => r.idx > p.lastDoneIdx && r.station.crew && r.station.mile > 0 && r.station.mile < COURSE.distance);

    const fc = clockFromElapsed(projFinish);
    const badgeCls = deltaClass(goalDelta);
    const badgeTxt = Math.abs(Math.round(goalDelta)) < 1 ? "On plan"
      : (goalDelta > 0 ? "+" + fmtElapsed(goalDelta) + " behind" : fmtElapsed(-goalDelta) + " ahead");
    v.appendChild(el(`<div class="card hero">
      <div class="card-label">Projected finish · plan ${goalLabel(goal())}${DEMO_MODE ? " · demo" : ""}</div>
      <div class="hero-row">
        <div><div class="hero-finish">${fmtElapsed(projFinish)}</div><div class="hero-clock">${fc.time} ${fc.day}</div></div>
        <span class="badge ${badgeCls}">${badgeTxt}</span>
      </div>
      <div class="hero-extra">
        <div class="hero-mini"><div class="k">Data</div><div class="v">${esc(dataSummary().label)}</div></div>
        <div class="hero-mini"><div class="k">Next crew</div><div class="v">${nextCrew ? esc(nextCrew.station.name) : "Finish"}</div></div>
      </div>
      <div class="hero-last">
        ${ lastDone
          ? (lastDone.timed
            ? `<span>Last in: <b>${esc(lastDone.station.name)}</b></span><span><b>${clockFromElapsed(lastDone.actual).time}</b> · ${fmtDelta(lastDone.delta)} min</span>`
            : `<span>Last passed: <b>${esc(lastDone.station.name)}</b></span><span>time unknown · projected ${clockFromElapsed(lastDone.projected).time}</span>`)
          : `<span>Race not started — showing the planned schedule.</span>` }
      </div>
    </div>`));

    // Manual position stepper — advance/back through the schedule when the tracker is quiet
    const cur = p.lastDoneIdx >= 0 ? p.rows[p.lastDoneIdx] : null;
    const atEnd = p.lastDoneIdx >= COURSE.stations.length - 1;
    const posCard = el(`<div class="card pos-card">
      <div class="card-label">Runner position — tap to advance if there's no live data</div>
      <div class="pos-row">
        <button class="posbtn ghost" id="pos-back" ${p.lastDoneIdx < 0 ? 'disabled' : ''}>◀ Back</button>
        <div class="pos-mid">
          <div class="pos-where">${cur ? esc(cur.station.name) : 'Not started'}</div>
          <div class="pos-sub">${cur
            ? fmtDist(cur.station.mile) + ' · ' + (cur.timed ? 'in ' + clockFromElapsed(cur.actual).time : 'passed, time unknown')
            : 'at the start line'}</div>
        </div>
        <button class="posbtn" id="pos-fwd" ${atEnd ? 'disabled' : ''}>Reached<br>next ▶</button>
      </div>
    </div>`);
    posCard.querySelector("#pos-back").onclick = () => advanceRunner(-1);
    posCard.querySelector("#pos-fwd").onclick = () => advanceRunner(1);
    v.appendChild(posCard);

    // Next crew stop (with crew job info)
    if (nextCrew) {
      const ac = clockFromElapsed(nextCrew.projected);
      const card = el(`<div class="card crew-card">
        <div class="card-label">Next crew stop</div>
        <div class="crew-top">
          <svg class="pin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <div>
            <div class="crew-name">${esc(nextCrew.station.name)}</div>
            <div class="crew-mile">${fmtDist(nextCrew.station.mile)} · ${fmtDist(nextCrew.station.mile - (lastDone?lastDone.station.mile:0))} to go</div>
          </div>
        </div>
        <div class="crew-grid">
          <div class="stat"><div class="k">Projected arrival</div><div class="v">${ac.time} <small>${ac.day}</small></div></div>
          <div class="stat"><div class="k">Countdown</div><div class="v">${fmtUntil(nextCrew.projected)}</div></div>
          <div class="stat"><div class="k">Elapsed at stop</div><div class="v">${fmtElapsed(nextCrew.projected)}</div></div>
          <div class="stat"><div class="k">Leave by</div><div class="v">${esc(nextCrew.station.leaveBy || "—")}</div></div>
        </div>
        ${parkingBlock(nextCrew.station.name)}
        ${nextCrew.station.haveReady ? `<div class="haveready"><div class="k">Have ready</div><div class="v">${esc(nextCrew.station.haveReady)}</div></div>` : ''}
        ${tipsBlock(nextCrew.station.name)}
        ${nextCrew.station.stopGoal ? `<div class="stopgoal"><b>Goal:</b> ${esc(nextCrew.station.stopGoal)}</div>` : ''}
      </div>`);
      v.appendChild(card);
    }

    // Mobile-smart upcoming list: next 3 + next crew + finish + last done for context
    const showIdx = new Set();
    const futures = p.rows.filter(r => r.idx > p.lastDoneIdx);
    futures.slice(0, 3).forEach(r => showIdx.add(r.idx));
    const nc = futures.find(r => r.station.crew && r.station.mile > 0 && r.station.mile < COURSE.distance);
    if (nc) showIdx.add(nc.idx);
    showIdx.add(p.rows.length - 1);
    if (p.lastDoneIdx >= 0) showIdx.add(p.lastDoneIdx);

    const listCard = el(`<div class="card"><div class="card-label">Schedule — tap a stop to log a split</div><div class="rows" id="trackRows"></div></div>`);
    const rowsWrap = listCard.querySelector("#trackRows");
    let prevIdx = -99;
    [...showIdx].sort((a,b)=>a-b).forEach(idx => {
      if (idx - prevIdx > 1 && prevIdx >= 0) rowsWrap.appendChild(el(`<div style="text-align:center;color:var(--text-muted);font-size:0.62rem;font-weight:700;padding:0.2rem 0;letter-spacing:0.08em;">⋯ ${idx - prevIdx - 1} more ⋯</div>`));
      rowsWrap.appendChild(stationRow(p.rows[idx])); prevIdx = idx;
    });
    v.appendChild(listCard);
  }

  function stationRow(r, full) {
    const s = r.station;
    const pc = clockFromElapsed(r.projected);
    const cls = "srow" + (r.isDone ? " done" : "") + (r.isCurrent ? " next" : "");
    const row = el(`<div class="${cls}">
      <div class="mi">${fmtDist(s.mile)}</div>
      <div class="nm">${esc(s.name)}${s.crew ? '<span class="crewtag">CREW</span>' : ''}${r.isDone ? '<span class="donetag">'+(r.timed?'✓ IN':'✓ passed · no time')+'</span>' : ''}</div>
      <div class="proj">${pc.time}<div class="day">${fmtElapsed(r.projected)}${pc.day?(' · '+pc.day):''}</div></div>
      <div class="delta ${deltaClass(r.delta)}">${r.isDone||r.adjust?fmtDelta(r.delta):''}</div>
    </div>`);
    row.addEventListener("click", () => { expanded = (expanded === s.name ? null : s.name); render(); openTab(activeTab); });
    const wrap = document.createElement("div");
    wrap.appendChild(row);
    if (expanded === s.name) wrap.appendChild(stationEditor(r, full));
    return wrap;
  }

  // full=true (Crew tab) also exposes the crew note + parking coordinate fields.
  function stationEditor(r, full) {
    const s = r.station; const ss = stStation(s.name);
    const st = (flash && flash.name === s.name) ? flash : null;
    const defaultMsg = DEMO_MODE
      ? "Demo mode saves locally and never writes to the sheet."
      : "Logging an actual arrival shifts every later projection. "
        + (writeEndpoint() ? "Saving syncs to the sheet automatically." : "Add an Apps Script URL on the Data tab to write back to the sheet.");
    const reachedNow = ss.reached || ss.actual != null;
    const ed = el(`<div class="editor">
      <div class="info">Plan <b>${s.etaText || fmtElapsed(r.planned)}</b>${s.haveReady?` · Have ready: ${esc(s.haveReady)}`:''}${s.stopGoal?`<br>${esc(s.stopGoal)}`:''}</div>
      <div class="editor-grid">
        <div class="field"><label>Actual arrival (clock)</label><input type="time" id="ed-actual" value="${ss.actual!=null?clock24FromElapsed(ss.actual):''}"></div>
        <div class="quick-actions">
          <button class="btn ghost" id="ed-now">Set to now</button>
        </div>
        <div class="field"><label>Adjust ± min</label>
          <div class="stepper"><button id="ed-minus">−</button><input id="ed-adjust" inputmode="numeric" value="${ss.adjust||0}"><button id="ed-plus">+</button></div>
        </div>
      </div>
      ${full ? `<div class="editor-grid" style="margin-top:0.6rem">
        <div class="field wide"><label>Crew note / tip (saved on this device)</label><textarea id="ed-note" placeholder="Anything useful for here — parking, access, what to watch for…">${esc(ss.note||'')}</textarea></div>
      </div>` : ''}
      ${full && s.crew ? `<div class="editor-grid" style="margin-top:0.5rem">
        <div class="field"><label>Parking lat</label><input id="ed-lat" inputmode="decimal" placeholder="${crewInfo(s.name)?crewInfo(s.name).lat:'lat'}" value="${ss.lat!=null?ss.lat:''}"></div>
        <div class="field"><label>Parking lng</label><input id="ed-lng" inputmode="decimal" placeholder="${crewInfo(s.name)?crewInfo(s.name).lng:'lng'}" value="${ss.lng!=null?ss.lng:''}"></div>
      </div>` : ''}
      <div class="editor-actions">
        <button class="btn big" id="ed-save">Save split</button>
        <button class="btn big ghost" id="ed-reached">${reachedNow ? 'Undo reached' : 'Mark reached (no time)'}</button>
        <button class="btn big ghost" id="ed-clear">Clear</button>
      </div>
      <div class="status-line ${st?st.kind:'muted'}" id="ed-status">${st ? esc(st.msg) : defaultMsg}</div>
    </div>`);
    const adj = ed.querySelector("#ed-adjust");
    ed.querySelector("#ed-minus").onclick = () => { adj.value = (parseInt(adj.value||0,10) - 1); };
    ed.querySelector("#ed-plus").onclick  = () => { adj.value = (parseInt(adj.value||0,10) + 1); };
    ed.querySelector("#ed-now").onclick = () => {
      const n = nowElapsedNear(r.planned);
      if (n == null || Math.abs(n - r.planned) > 12 * 60) {
        setStatus(ed.querySelector("#ed-status"), "Current clock time is too far from the planned arrival for this stop. Enter the arrival time manually.", "warn");
        return;
      }
      ed.querySelector("#ed-actual").value = clock24FromElapsed(n);
      setStatus(ed.querySelector("#ed-status"), "Set arrival to the current clock time. Save to apply it.", "muted");
    };
    ed.querySelector("#ed-save").onclick = () => {
      const t = ed.querySelector("#ed-actual").value;
      ss.adjust = parseInt(adj.value||0,10) || 0;
      const actual = t ? elapsedFromClock(t, r.planned) : null;
      if (actual != null && Math.abs(actual - r.planned) > 12 * 60) {
        setStatus(ed.querySelector("#ed-status"), "That clock time is more than 12 hours from the planned stop time. Check the station or clear the time.", "err");
        return;
      }
      ss.actual = actual;
      if (ss.actual != null) ss.reached = true;
      const noteEl = ed.querySelector("#ed-note"); if (noteEl) ss.note = noteEl.value.trim();
      const latEl = ed.querySelector("#ed-lat"), lngEl = ed.querySelector("#ed-lng");
      if (latEl && lngEl) {
        const la = parseFloat(latEl.value), ln = parseFloat(lngEl.value);
        if (!isNaN(la) && !isNaN(ln)) { ss.lat = la; ss.lng = ln; }
        else if (latEl.value.trim() === "" && lngEl.value.trim() === "") { delete ss.lat; delete ss.lng; }
      }
      save();
      // Only sync a real split (a logged time, an adjustment, or already reached) to the
      // sheet — editing just a note or parking pin stays on this device.
      const isSplit = ss.actual != null || ss.adjust !== 0 || ss.reached;
      if (isSplit && writeEndpoint()) {
        flash = { name: s.name, msg: "Saved — syncing to sheet…", kind: "muted" };
        expanded = s.name; render(); openTab(activeTab);
        pushStationToSheet(s.name, document.querySelector("#view-" + activeTab + " #ed-status"));
      } else {
        flash = { name: s.name, msg: DEMO_MODE ? "Saved in demo mode. Sheet writes are disabled." : (isSplit ? "Saved on this device." : "Saved."), kind: "muted" };
        expanded = s.name; render(); openTab(activeTab);
      }
    };
    ed.querySelector("#ed-reached").onclick = () => {
      if (reachedNow) { ss.reached = false; ss.actual = null; ss.adjust = 0; save(); clearStationInSheet(s.name); }
      else { ss.reached = true; save(); if (writeEndpoint()) pushStationToSheet(s.name, null); }
      expanded = null; flash = null; render(); openTab(activeTab);
    };
    ed.querySelector("#ed-clear").onclick = () => { ss.actual = null; ss.adjust = 0; ss.reached = false; save(); clearStationInSheet(s.name); expanded = null; flash = null; render(); openTab(activeTab); };
    return ed;
  }

  /* ---- PACE ---- */
  function renderPace() {
    const v = $("#view-pace"); v.innerHTML = "";
    if (!hasCourse()) {
      const card = emptyCourseCard(dataState.message);
      v.appendChild(card); attachEmptyActions(card);
      return;
    }
    const g = paceGoal();
    const presets = [
      { label:"Plan " + goalLabel(PLAN_FINISH), min: PLAN_FINISH, note:"your sheet plan" },
      { label:"Sub-24 · Silver", min:1440, note:"Silver buckle" },
      { label:"Sub-30 · Finisher", min:1800, note:"Finisher buckle" },
    ];
    const chips = el(`<div class="chips"></div>`);
    presets.forEach(pr => {
      const c = el(`<button class="chip ${g===pr.min?'active':''}">${pr.label}</button>`);
      c.onclick = () => { state.paceGoalMin = (pr.min===PLAN_FINISH?null:pr.min); save(); render(); openTab('pace'); };
      chips.appendChild(c);
    });
    const customActive = !presets.some(pr => pr.min === g);
    const custom = el(`<button class="chip ${customActive?'active':''}">Custom…</button>`);
    custom.onclick = () => { const ans = prompt("Goal finish time (H:MM)", goalLabel(g)); if (ans) { const m = parseHM(ans); if (m) { state.paceGoalMin = m; save(); render(); openTab('pace'); } } };
    chips.appendChild(custom);
    v.appendChild(chips);

    const note = presets.find(pr => pr.min === g);
    v.appendChild(el(`<div class="buckle-note">Targets to finish in <b>${goalLabel(g)}</b>${note?` — ${note.note}`:''}. Pacing keeps the shape of your sheet plan, scaled to the goal. Western States awards a <b>silver buckle</b> under 24:00 and a <b>finisher buckle</b> under 30:00.</div>`));

    const p = project();
    const lastDone = p.lastDoneIdx >= 0 ? p.rows[p.lastDoneIdx] : null;
    const lastTimed = lastTimedRow(p);
    const fh = el(`<div class="card"><div class="from-here">
        <input type="checkbox" id="fhToggle" ${state.paceFromHere&&lastTimed?'checked':''} ${lastTimed?'':'disabled'}>
        <label for="fhToggle">Pace needed <b>from here</b> ${lastTimed?`(last timed: ${esc(lastTimed.station.name)}, ${fmtElapsed(lastTimed.actual)})`:(lastDone?'(last reached has no time yet)':'(log a timed split first)')}</label>
      </div><div id="paceTableWrap"></div></div>`);
    fh.querySelector("#fhToggle").onchange = (e) => { state.paceFromHere = e.target.checked; save(); render(); openTab('pace'); };
    v.appendChild(fh);

    const fromHere = state.paceFromHere && lastTimed;
    const planned = plannedSplits();
    let splits = [], paces = [];
    if (fromHere) {
      const remGoal = g - lastTimed.actual;
      const planRem = PLAN_FINISH - planned[lastTimed.idx];
      const factor = planRem > 0 ? remGoal / planRem : 1;
      COURSE.stations.forEach((s,i) => {
        if (i < lastTimed.idx) { splits[i] = state.stations[s.name]?.actual ?? null; paces[i] = null; }
        else if (i === lastTimed.idx) { splits[i] = lastTimed.actual; paces[i] = null; }
        else {
          splits[i] = lastTimed.actual + (planned[i] - planned[lastTimed.idx]) * factor;
          const prevSplit = splits[i-1] ?? lastTimed.actual;
          const seg = s.mile - COURSE.stations[i-1].mile;
          paces[i] = seg ? (splits[i] - prevSplit) / seg : null;
        }
      });
    } else {
      const factor = PLAN_FINISH > 0 ? g / PLAN_FINISH : 1;
      COURSE.stations.forEach((s,i) => {
        splits[i] = planned[i] * factor;
        const seg = i ? s.mile - COURSE.stations[i-1].mile : 0;
        paces[i] = seg ? (splits[i] - splits[i-1]) / seg : null;
      });
    }

    const tbl = el(`<table class="splits"><thead><tr><th>Aid station</th><th>${distU()==='km'?'Km':'Mi'}</th><th>Pace</th><th>Clock</th><th>Elapsed</th></tr></thead><tbody></tbody></table>`);
    const tb = tbl.querySelector("tbody");
    COURSE.stations.forEach((s,i) => {
      if (splits[i] == null) return;
      const cc = clockFromElapsed(splits[i]);
      tb.appendChild(el(`<tr class="${s.crew?'crewrow':''}">
        <td class="stname">${esc(s.name)}${s.crew?' <span style="color:var(--orange);font-weight:800;font-size:0.7rem;">●</span>':''}</td>
        <td>${toDist(s.mile).toFixed(1)}</td>
        <td class="pace">${paces[i]?fmtPace(toPace(paces[i]))+'<small style="color:var(--text-muted);font-weight:600">'+paceU()+'</small>':'—'}</td>
        <td>${cc.time}<br><span style="font-size:0.66rem;color:var(--text-muted)">${cc.day}</span></td>
        <td>${fmtElapsed(splits[i])}</td></tr>`));
    });
    fh.querySelector("#paceTableWrap").appendChild(tbl);
    v.appendChild(el(`<div class="buckle-note">● = crew-access stop. Average pace for ${goalLabel(g)} is ${fmtPaceU(g/COURSE.distance)} over ${fmtDist(COURSE.distance)}.</div>`));
  }

  /* ---- CREW HELPER ---- */
  function renderSplits() {
    const v = $("#view-splits"); v.innerHTML = "";
    if (!hasCourse()) {
      const card = emptyCourseCard(dataState.message);
      v.appendChild(card); attachEmptyActions(card);
      return;
    }
    const p = project();
    v.appendChild(el(`<div class="sectiontitle">Crew helper</div>`));
    v.appendChild(el(`<div class="buckle-note" style="margin-top:-0.3rem">Your crew-access stops, in order. Tap <b>Parking in Maps</b> to navigate, read the tips, and add your own notes. Tap a stop to log the runner in.</div>`));

    // Crew-access stops as rich cards
    const crewRows = p.rows.filter(r => r.station.crew);
    crewRows.forEach(r => {
      const s = r.station; const ac = clockFromElapsed(r.projected);
      const doneTag = r.isDone ? `<span class="donetag">${r.timed?'✓ IN':'✓ passed · no time'}</span>` : '';
      const showTips = r.isCurrent || expanded === s.name;
      const card = el(`<div class="card crew-helper-card${r.isDone?' done':''}${r.isCurrent?' next':''}">
        <div class="ch-top">
          <div style="flex:1;min-width:0"><div class="crew-name">${esc(s.name)} ${doneTag}</div>
            <div class="crew-mile">${fmtDist(s.mile)} · proj. <b>${ac.time}</b> ${ac.day} · ${fmtElapsed(r.projected)}${r.isDone||r.adjust?` · <span class="${deltaClass(r.delta)} dlt">${fmtDelta(r.delta)} min</span>`:''}</div>
          </div>
          <span class="ch-log">${expanded===s.name?'Close ▴':'Log ▾'}</span>
        </div>
        ${parkingBlock(s.name)}
        ${s.haveReady ? `<div class="haveready"><div class="k">Have ready</div><div class="v">${esc(s.haveReady)}</div></div>` : ''}
        ${showTips ? tipsBlock(s.name) : ''}
      </div>`);
      card.querySelector(".ch-top").addEventListener("click", () => { expanded = (expanded === s.name ? null : s.name); render(); openTab(activeTab); });
      if (expanded === s.name) card.appendChild(stationEditor(r, true));
      v.appendChild(card);
    });

    // Full schedule (all stops)
    v.appendChild(el(`<div class="sectiontitle" style="margin-top:1.4rem">Full schedule — every stop</div>`));
    const card = el(`<div class="card"><div class="rows" id="allRows"></div></div>`);
    const wrap = card.querySelector("#allRows");
    p.rows.forEach(r => wrap.appendChild(stationRow(r, true)));
    v.appendChild(card);
  }

  /* ---- DATA ---- */
  function renderData() {
    const v = $("#view-data"); v.innerHTML = "";
    const ds = dataSummary();
    const connected = !!writeEndpoint();
    const hardcoded = !!SHEET_WRITE_URL;
    const healthMsg = dataState.kind === "error" || dataState.kind === "empty" || dataState.kind === "loading" || dataState.kind === "cached" || DEMO_MODE
      ? dataState.message
      : (ds.label === "Stale" ? "Last successful sheet sync was " + ds.detail + ". Refresh before relying on shared crew data." : "Live sheet data is available. Last sync: " + ds.detail + ".");
    const demoHref = DEMO_MODE ? window.location.pathname : window.location.pathname + "?demo=1";
    const demoLabel = DEMO_MODE ? "Exit demo mode" : "Enable demo mode";

    const health = el(`<div class="card status-card">
      <div class="card-label">Health</div>
      ${statusPill()}
      <div class="status-grid">
        <div class="stat"><div class="k">Source</div><div class="v">${esc(ds.source)}</div></div>
        <div class="stat"><div class="k">Stops</div><div class="v">${COURSE.stations.length || "—"}</div></div>
        <div class="stat"><div class="k">Last sync</div><div class="v">${state.lastSync ? clockFromAbs(state.lastSync) : "—"}</div></div>
        <div class="stat"><div class="k">Writes</div><div class="v">${DEMO_MODE ? "Demo off" : (connected ? "On" : "Off")}</div></div>
      </div>
      <div class="status-line ${ds.cls === 'err' ? 'err' : ds.cls === 'warn' ? 'warn' : 'muted'}">${esc(healthMsg)}</div>
      <div class="mode-actions">
        <a class="btn btn-link ${DEMO_MODE ? 'ghost' : ''}" href="${demoHref}">${demoLabel}</a>
      </div>
    </div>`);
    v.appendChild(health);

    const sheet = el(`<div class="card">
      <div class="card-label">Data store</div>
      <div class="sheet-chip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${ds.cls === 'err' ? 'var(--red)' : ds.cls === 'warn' ? 'var(--amber)' : 'var(--green)'}" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <div><div class="nm">${esc(SHEET.tab)}</div><div class="sub">${esc(ds.label)}${state.lastSync?' · '+clockFromAbs(state.lastSync):''}</div></div>
        <a href="${SHEET_EDIT_URL}" target="_blank" rel="noopener">Open sheet ↗</a>
      </div>
      <button class="btn block" id="sh-pull">Refresh from sheet ⤓</button>
      <div class="status-line muted" id="sh-status">Pulls the live <b>${esc(SHEET.tab)}</b> tab and replaces this device's view with the sheet's current values. Empty or corrupt sheet data keeps the embedded plan.</div>
    </div>`);
    sheet.querySelector("#sh-pull").onclick = () => pullFromSheet(sheet.querySelector("#sh-status"), true, true);
    v.appendChild(sheet);

    const write = el(`<div class="card">
      <div class="card-label">Write back — Adjust +/- min</div>
      <div class="sheet-chip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${connected?'var(--green)':'var(--text-muted)'}" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <div><div class="nm">${connected ? 'Auto-sync on' : 'Not connected'}</div>
          <div class="sub">${DEMO_MODE ? 'Demo mode — sheet writes are disabled.' : (hardcoded ? 'Hardcoded endpoint — every crew device writes to the sheet.' : (state.writeUrl ? 'Using a per-device endpoint.' : 'Save split writes only on this device until connected.'))}</div></div>
      </div>
      <div class="help" style="margin-bottom:0.8rem">${DEMO_MODE
        ? 'Demo mode stores progress locally and never calls the Apps Script endpoint.'
        : hardcoded
        ? 'The write endpoint is hardcoded to this sheet — <b>Save split</b> updates <code>Adjust +/- min</code> for all crew automatically.'
        : 'To turn on automatic writes: open <a href="'+SHEET_EDIT_URL+'" target="_blank" rel="noopener">the sheet</a> → <b>Extensions → Apps Script</b>, paste the script from the tool\'s CLAUDE.md, then <b>Deploy → New deployment → Web app</b> (Execute as: Me, Access: Anyone). Send Ian the <code>/exec</code> URL to hardcode it, or paste it below for just this device.'}</div>
      <div class="setting"><label class="lab">Override endpoint (optional)</label><input type="text" id="wr-url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(state.writeUrl)}" ${DEMO_MODE?'disabled':''}></div>
      <div class="row2">
        <button class="btn ghost" id="wr-save" ${DEMO_MODE?'disabled':''}>Save</button>
        <button class="btn" id="wr-push" ${connected?'':'disabled'}>Push all now ⤒</button>
      </div>
      <div class="status-line ${connected?'ok':'muted'}" id="wr-status">${DEMO_MODE?'Demo mode — pushing is disabled.':(connected?'Connected — saving a split syncs automatically.':'No write endpoint yet — pushing is disabled.')}</div>
    </div>`);
    write.querySelector("#wr-save").onclick = () => { state.writeUrl = write.querySelector("#wr-url").value.trim(); save(); render(); openTab('data'); };
    write.querySelector("#wr-push").onclick = () => pushAllToSheet(write.querySelector("#wr-status"));
    v.appendChild(write);

    const offline = el(`<div class="card">
      <div class="card-label">Offline use</div>
      <div class="sheet-chip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${offlineState.ready?'var(--green)':'var(--amber)'}" stroke-width="2"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/></svg>
        <div><div class="nm">${offlineState.ready ? 'Offline cache ready' : 'Prepare before race day'}</div>
          <div class="sub">${offlineState.supported ? esc(offlineState.message) : 'Not supported in this browser.'}</div></div>
      </div>
      <button class="btn block" id="offline-prepare" ${offlineState.supported?'':'disabled'}>Prepare offline use</button>
      <div class="status-line muted" id="offline-status">Caches the crew tracker app shell on this device. The last successful live sheet plan is also saved locally.</div>
      ${offlineGuideHtml()}
    </div>`);
    offline.querySelector("#offline-prepare").onclick = () => prepareOfflineUse(offline.querySelector("#offline-status"));
    v.appendChild(offline);

    const setup = el(`<div class="card">
      <div class="card-label">Race setup</div>
      <div class="setting"><label class="lab">Units</label>
        <div class="seg" id="unit-seg">
          <button data-u="imperial" class="${isMetric()?'':'active'}">Miles</button>
          <button data-u="metric" class="${isMetric()?'active':''}">Kilometres</button>
        </div>
      </div>
      <div class="setting"><label class="lab">Runner name</label><input type="text" id="set-runner" placeholder="e.g. Ian" value="${esc(state.runnerName)}"></div>
      <div class="setting row2">
        <div><label class="lab">Start date</label><input type="date" id="set-date" value="${state.startDate}"></div>
        <div><label class="lab">Start time</label><input type="time" id="set-time" value="${state.startTime}"></div>
      </div>
      <div class="setting"><label class="lab">Compare against (goal)</label><input type="text" id="set-goal" value="${goalLabel(goal())}" placeholder="H:MM"></div>
      <button class="btn block" id="set-save">Save setup</button>
      <div class="status-line muted">Plan finish from the sheet is <b>${goalLabel(PLAN_FINISH)}</b>. Leave the goal there to track the plan, or set sub-24 / sub-30 to compare.</div>
    </div>`);
    setup.querySelectorAll("#unit-seg button").forEach(b => b.onclick = () => { state.units = b.dataset.u; save(); render(); openTab('data'); });
    setup.querySelector("#set-save").onclick = () => {
      state.runnerName = setup.querySelector("#set-runner").value.trim();
      state.startDate = setup.querySelector("#set-date").value;
      state.startTime = setup.querySelector("#set-time").value || "05:00";
      state.startTimeUserSet = true;
      const gg = parseHM(setup.querySelector("#set-goal").value);
      state.goalMin = (gg && Math.abs(gg - PLAN_FINISH) > 0.5) ? gg : null;
      save(); render(); openTab('data');
    };
    v.appendChild(setup);

    const danger = el(`<div class="card"><div class="card-label">Reset</div>
      <button class="btn block ghost" id="reset-all">Clear all logged splits &amp; adjustments</button></div>`);
    danger.querySelector("#reset-all").onclick = () => { if (confirm("Clear all logged splits and adjustments?")) { state.stations = {}; save(); render(); openTab('data'); } };
    v.appendChild(danger);
  }
  function setStatus(node, msg, kind) { if(!node) return; node.innerHTML = msg; node.className = "status-line " + (kind||'muted'); }

  /* ── Google Sheet I/O ──────────────────────────────────────────────────── */
  function parseCSV(text) {
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"' && text[i+1] === '"') { field += '"'; i++; } else if (c === '"') q = false; else field += c; }
      else { if (c === '"') q = true; else if (c === ',') { row.push(field); field = ""; } else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; } else if (c === '\r') {} else field += c; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }
  // Parse CSV rows -> {courseRows, adjustByName}
  function ingestSheet(rows) {
    if (!Array.isArray(rows) || !rows.length) return { courseRows:[], adjustByName:{} };
    let hIdx = 0;
    for (let i = 0; i < Math.min(rows.length, 5); i++) { if (rows[i].join(" ").toLowerCase().match(/crew stop|aid|station|mile|adjust/)) { hIdx = i; break; } }
    if (!rows[hIdx]) return { courseRows:[], adjustByName:{} };
    const H = rows[hIdx].map(h => h.toLowerCase().trim());
    const find = (...keys) => H.findIndex(h => keys.some(k => h.includes(k)));
    const cMile = find("mile","dist"), cName = find("crew stop","aid","station","location","name"),
          cEta = find("eta","arriv"), cLeave = find("leave"), cAdjust = find("adjust","+/-"),
          cGoal = find("stop goal","goal"), cReady = find("have ready","ready"), cNotes = find("note");
    const courseRows = [], adjustByName = {};
    for (let i = hIdx + 1; i < rows.length; i++) {
      const r = rows[i]; if (!r || cName < 0 || !r[cName] || !r[cName].trim()) continue;
      const name = r[cName].trim();
      courseRows.push({
        mile: cMile>=0 ? parseFloat(r[cMile])||0 : 0, name,
        eta: cEta>=0 ? (r[cEta]||"").trim() : "", leaveBy: cLeave>=0 ? (r[cLeave]||"").trim() : "",
        stopGoal: cGoal>=0 ? (r[cGoal]||"").trim() : "", haveReady: cReady>=0 ? (r[cReady]||"").trim() : "",
        notes: cNotes>=0 ? (r[cNotes]||"").trim() : "",
      });
      if (cAdjust>=0 && r[cAdjust] !== undefined && r[cAdjust] !== "") { const a = parseFloat(r[cAdjust]); if (!isNaN(a)) adjustByName[name] = a; }
    }
    return { courseRows, adjustByName };
  }
  // replace=true  → sheet is authoritative: rebuild progress purely from the sheet's
  //   Adjust +/- min column (clears local-only splits). Used by the Refresh buttons.
  // replace=false → background merge on load: take the sheet's adjustments but keep any
  //   local split the sheet doesn't have yet (e.g. logged offline, not pushed).
  async function pullFromSheet(status, loud, replace) {
    if (DEMO_MODE) {
      dataState = { kind:"demo", message:"Demo mode uses local sample progress. Sheet refresh is skipped and writes are disabled.", source:"Demo data", lastAttempt:Date.now() };
      if (loud) setStatus(status, dataState.message, "muted");
      render(); openTab(activeTab);
      return;
    }
    dataState = { kind:"loading", message:"Refreshing the live sheet…", source:"Sheet", lastAttempt:Date.now() };
    if (loud) setStatus(status, "Refreshing…", "muted");
    try {
      const res = await fetch(SHEET_CSV_URL + "&_cb=" + Date.now(), { cache:"no-store" }); // cache-buster → fresh read
      if (!res.ok) throw new Error("HTTP " + res.status);
      const { courseRows, adjustByName } = ingestSheet(parseCSV(await res.text()));
      if (!courseRows.length) {
        dataState = { kind:"empty", message:"The live sheet returned no valid stops. Keeping the embedded/saved plan.", source:"Embedded plan", lastAttempt:Date.now() };
        render(); openTab(activeTab);
        if (loud) setStatus(status, dataState.message, "warn");
        return;
      }
      if (!buildCourse(courseRows)) {
        dataState = { kind:"empty", message:"The live sheet data could not be converted into a course. Keeping the embedded/saved plan.", source:"Embedded plan", lastAttempt:Date.now() };
        render(); openTab(activeTab);
        if (loud) setStatus(status, dataState.message, "warn");
        return;
      }
      saveLastSheet(courseRows, adjustByName);
      mergeSheetAdjustments(adjustByName, replace);
      state.lastSync = Date.now(); save(); render(); openTab(activeTab);
      dataState = { kind:"synced", message:"Synced " + courseRows.length + " stops from the live sheet.", source:"Sheet", lastAttempt:Date.now() };
      render(); openTab(activeTab);
      if (loud) setStatus(status, `Synced ${courseRows.length} stops at ${clockFromAbs(state.lastSync)}.`, "ok");
    } catch (e) {
      dataState = { kind:"error", message:"Couldn't reach the sheet — still using the saved or embedded plan. (" + e.message + ")", source:COURSE.stations.length ? "Saved plan" : "No data", lastAttempt:Date.now() };
      render(); openTab(activeTab);
      if (loud) setStatus(status, "Couldn't reach the sheet — still using the saved plan. (" + e.message + ")", "err");
    }
  }
  async function pushAllToSheet(status) {
    const url = writeEndpoint();
    if (DEMO_MODE) { setStatus(status, "Demo mode — no sheet writes were sent.", "muted"); return; }
    if (!url) { setStatus(status, "No write endpoint connected yet.", "err"); return; }
    const p = project();
    const payload = p.rows.filter(r => r.adjust || r.actual != null || r.reached).map(r => ({
      station: r.station.name, mile: r.station.mile, adjust: r.incAdjust, total: Math.round(r.delta),
      actual: r.actual != null ? clockFromElapsed(r.actual).time : "",
    }));
    if (!payload.length) { setStatus(status, "Nothing to push yet — log a split first.", "muted"); return; }
    setStatus(status, "Pushing " + payload.length + " rows…", "muted");
    try {
      await fetch(url, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify({ updates: payload }) });
      setStatus(status, "Pushed " + payload.length + " adjustments. Refresh the sheet to confirm.", "ok");
    } catch (e) { setStatus(status, "Push failed: " + e.message, "err"); }
  }
  async function pushStationToSheet(name, status) {
    const url = writeEndpoint();
    if (DEMO_MODE) { setStatus(status, "Demo mode — saved locally, no sheet write sent.", "muted"); return; }
    if (!url) { setStatus(status, "No write endpoint connected yet (Data tab).", "err"); return; }
    const r = project().rows.find(x => x.station.name === name);
    if (!r) { setStatus(status, "Couldn't find that stop in the current course.", "err"); return; }
    setStatus(status, "Pushing…", "muted");
    try {
      await fetch(url, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" },
        body: JSON.stringify({ updates: [{ station:name, mile:r.station.mile, adjust:r.incAdjust, total:Math.round(r.delta), actual:r.actual!=null?clockFromElapsed(r.actual).time:"" }] }) });
      setStatus(status, "Pushed " + name + " (adjust " + fmtDelta(r.incAdjust) + ", total " + fmtDelta(r.delta) + ").", "ok");
    } catch (e) { setStatus(status, "Push failed: " + e.message, "err"); }
  }
  // Blank a stop's Adjust cell in the sheet (clears "reached" there too).
  async function clearStationInSheet(name) {
    const url = writeEndpoint(); if (!url) return;
    try { await fetch(url, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify({ updates: [{ station:name, adjust:"" }] }) }); } catch (e) {}
  }

  /* ── Tabs ──────────────────────────────────────────────────────────────── */
  function openTab(tab) {
    activeTab = tab;
    ["track","pace","splits","data"].forEach(t => $("#view-" + t).classList.toggle("hidden", t !== tab));
    [...$("#tabbar").children].forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    window.scrollTo({ top: 0 });
  }
  $("#tabbar").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; expanded = null; openTab(b.dataset.tab); });

  // Header refresh — pull the latest from the sheet (authoritative) from any tab.
  $("#topRefresh").addEventListener("click", async () => {
    const btn = $("#topRefresh"); if (btn.classList.contains("spinning")) return;
    btn.classList.add("spinning"); expanded = null;
    try { await pullFromSheet(null, false, true); } finally { btn.classList.remove("spinning"); }
  });

  /* ── Init ──────────────────────────────────────────────────────────────── */
  if (buildCourse(SHEET_SNAPSHOT)) {
    dataState = DEMO_MODE
      ? { kind:"demo", message:"Demo mode uses local sample progress. Sheet writes are disabled.", source:"Demo data", lastAttempt:Date.now() }
      : { kind:"snapshot", message:"Using embedded plan until the sheet responds.", source:"Embedded plan", lastAttempt:Date.now() };
  } else {
    dataState = { kind:"empty", message:"The embedded snapshot has no valid stops. Use the Data tab to refresh from the sheet.", source:"No data", lastAttempt:Date.now() };
  }
  const cachedSheet = loadLastSheet();
  if (!DEMO_MODE && cachedSheet?.courseRows?.length && buildCourse(cachedSheet.courseRows)) {
    mergeSheetAdjustments(cachedSheet.adjustByName || {}, false);
    dataState = {
      kind:"cached",
      message:"Using the last live sheet saved on this device from " + clockFromAbs(cachedSheet.savedAt) + ".",
      source:"Last saved sheet",
      savedAt:cachedSheet.savedAt,
      lastAttempt:cachedSheet.savedAt,
    };
  }
  applyDemoSeed();
  render();
  openTab("track");
  if (!DEMO_MODE) pullFromSheet(null, false);    // then refresh from the live sheet
  initOfflineUse();
  </script>
</body>
</html>
