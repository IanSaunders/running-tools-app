<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Crew Tracker — Western States 100</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Stop iOS double-tap-to-zoom on taps (esp. the +/- steppers) */
    button, input, select, textarea, a, [role="link"], .stepper { touch-action: manipulation; }

    :root {
      --orange: #e57a32;
      --orange-dark: #cf6a26;
      --green: #16a34a;
      --green-bg: #ecfdf3;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --amber: #b45309;
      --amber-bg: #fffbeb;
      --bg: #FBFAFA;
      --card: #ffffff;
      --border: #e8e8e8;
      --text: #22272E;
      --text-muted: #73737D;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 6px 16px -8px rgba(0,0,0,0.12);
      --radius: 14px;
    }

    html { font-size: 100%; -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(72px + env(safe-area-inset-bottom));
    }

    .wrap { max-width: 640px; margin: 0 auto; padding: 0 1rem; }

    /* ── Header ── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(251,250,250,0.92);
      backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }
    .topbar-inner {
      max-width: 640px; margin: 0 auto;
      padding: 0.7rem 1rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .brand-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
    .topbar h1 { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
    .topbar .sub { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
    .topbar .sub .dot { color: var(--green); }
    .topbar .sub .dot.stale { color: var(--amber); }
    .topbar .sub .dot.off { color: var(--red); }
    .topbar .sub .dot.demo { color: #2c61c4; }
    .home-link { font-size: 0.8rem; color: var(--text-muted); text-decoration: none; font-weight: 600; }
    .home-link:hover { color: var(--text); }
    .top-refresh { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer;
      width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; padding: 0; }
    .top-refresh:hover { color: var(--orange); background: rgba(229,122,50,0.08); }
    .top-refresh svg { width: 18px; height: 18px; }
    .top-refresh.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main { padding: 1rem 0 2rem; }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.15rem;
      margin-bottom: 0.9rem;
    }
    .card-label {
      font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;
    }

    /* ── Hero status ── */
    .hero { background: linear-gradient(160deg, #2a2f37 0%, #22272E 100%); color: #fff; border: none; }
    .hero .card-label { color: rgba(255,255,255,0.55); }
    .hero-finish { font-size: 3rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
    .hero-clock { font-size: 1rem; font-weight: 600; color: rgba(255,255,255,0.7); margin-top: 0.35rem; }
    .hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.3rem 0.6rem; border-radius: 999px;
      font-size: 0.8rem; font-weight: 800; white-space: nowrap;
    }
    .badge.ahead { background: var(--green-bg); color: var(--green); }
    .badge.behind { background: var(--red-bg); color: var(--red); }
    .badge.even { background: rgba(255,255,255,0.15); color: #fff; }
    .hero-last { margin-top: 0.9rem; padding-top: 0.85rem; border-top: 1px solid rgba(255,255,255,0.13);
      font-size: 0.85rem; color: rgba(255,255,255,0.82); display: flex; justify-content: space-between; gap: 0.5rem; }
    .hero-last b { color: #fff; font-weight: 700; }
    .hero-extra { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.55rem; margin-top: 0.85rem; }
    .hero-mini { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 0.55rem 0.65rem; }
    .hero-mini .k { color: rgba(255,255,255,0.58); font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .hero-mini .v { color: #fff; font-size: 0.95rem; font-weight: 850; margin-top: 0.15rem; }

    /* ── Next crew stop ── */
    .crew-card { border-color: var(--orange); border-width: 1.5px; }
    .crew-top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.65rem; }
    .crew-top .pin { color: var(--orange); }
    .crew-name { font-size: 1.35rem; font-weight: 850; letter-spacing: -0.02em; line-height: 1.05; }
    .crew-mile { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .crew-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-top: 0.3rem; }
    .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.7rem; }
    .stat .k { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
    .stat .v { font-size: 1.25rem; font-weight: 850; letter-spacing: -0.01em; margin-top: 0.15rem; }
    .stat .v small { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); }
    .status-card { border-color: #dbe7fb; background: #f8fbff; }
    .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.65rem; }
    .status-pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; font-weight: 850; border-radius: 999px; padding: 0.3rem 0.55rem; margin-bottom: 0.55rem; }
    .status-pill.ok { color: var(--green); background: var(--green-bg); }
    .status-pill.warn { color: var(--amber); background: var(--amber-bg); }
    .status-pill.err { color: var(--red); background: var(--red-bg); }
    .status-pill.demo { color: #2c61c4; background: #eff6ff; }
    .empty-card { text-align: left; }
    .empty-card h2 { font-size: 1.25rem; letter-spacing: -0.02em; margin-bottom: 0.45rem; }
    .empty-card p { color: var(--text-muted); line-height: 1.55; font-size: 0.9rem; }
    .empty-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.9rem; }
    .mode-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.8rem; }
    .btn-link { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .offline-guide { margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px dashed #dbe7fb; }
    .offline-guide h3 { font-size: 0.95rem; margin-bottom: 0.4rem; }
    .offline-guide ol { margin-left: 1.2rem; color: var(--text-muted); font-size: 0.86rem; line-height: 1.55; }
    .offline-guide li + li { margin-top: 0.25rem; }
    .haveready { margin-top: 0.75rem; background: #fff7f1; border: 1px solid #f6dcc6; border-radius: 10px; padding: 0.6rem 0.7rem; }
    .haveready .k { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange); }
    .haveready .v { font-size: 0.92rem; font-weight: 600; margin-top: 0.15rem; line-height: 1.45; }
    .stopgoal { margin-top: 0.55rem; font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; }
    .stopgoal b { color: var(--text); font-weight: 700; }
    .more-link { margin-top: 0.7rem; font-size: 0.78rem; font-weight: 800; color: var(--orange); cursor: pointer; }
    .more-link:active { opacity: 0.7; }

    /* parking + tips */
    .parkrow { margin-top: 0.75rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .maps-btn { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--orange); color: #fff;
      text-decoration: none; font-weight: 800; font-size: 0.82rem; padding: 0.45rem 0.75rem; border-radius: 999px; white-space: nowrap; }
    .maps-btn:active { transform: translateY(1px); }
    .access-pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.28rem 0.55rem; font-size: 0.68rem; font-weight: 850; background: var(--green-bg); color: var(--green); }
    .access-pill.warn { background: var(--amber-bg); color: var(--amber); }
    .park-note { font-size: 0.74rem; color: var(--text-muted); line-height: 1.4; flex: 1; min-width: 9rem; }
    .park-note b { color: var(--text); }
    .approx { color: var(--amber); font-weight: 700; }
    .tips { margin-top: 0.7rem; background: #f4f8ff; border: 1px solid #dbe7fb; border-radius: 10px; padding: 0.6rem 0.7rem; }
    .tips-k { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #2c61c4; }
    .tips-v { font-size: 0.86rem; line-height: 1.5; margin-top: 0.15rem; }
    .crewnote { font-size: 0.84rem; line-height: 1.5; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px dashed #dbe7fb; }
    .crewnote b { color: var(--text); }
    .field textarea { font-size: 1rem; padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: 9px;
      background: var(--card); color: var(--text); font-family: inherit; width: 100%; min-height: 3.2rem; resize: vertical; }
    .field.wide { flex: 1 1 100%; }

    /* crew helper cards */
    .crew-helper-card { border-color: #f0d6c0; }
    .crew-helper-card.next { border-color: var(--orange); border-width: 1.5px; }
    .crew-helper-card.done { opacity: 0.66; }
    .ch-top { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; }
    .ch-top .crew-mile { margin-top: 0.15rem; }
    .ch-log { font-size: 0.78rem; font-weight: 800; color: var(--orange); white-space: nowrap; }
    .dlt.ahead { color: var(--green); } .dlt.behind { color: var(--red); } .dlt.even { color: var(--text-muted); }

    /* units segmented toggle */
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .seg button { border: none; background: var(--card); color: var(--text-muted); font-family: inherit;
      font-size: 0.85rem; font-weight: 800; padding: 0.5rem 0.9rem; cursor: pointer; }
    .seg button.active { background: var(--orange); color: #fff; }

    /* ── Position stepper ── */
    .pos-row { display: flex; align-items: center; gap: 0.6rem; }
    .pos-mid { flex: 1; text-align: center; min-width: 0; }
    .pos-where { font-weight: 850; font-size: 1.05rem; letter-spacing: -0.01em; line-height: 1.1; }
    .pos-sub { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; margin-top: 0.15rem; }
    .posbtn { border: 1px solid var(--orange); background: var(--orange); color: #fff; border-radius: 10px;
      padding: 0.5rem 0.7rem; font-size: 0.78rem; font-weight: 800; cursor: pointer; font-family: inherit; line-height: 1.05; white-space: nowrap; }
    .posbtn.ghost { background: var(--card); color: var(--text); border-color: var(--border); }
    .posbtn[disabled] { opacity: 0.4; pointer-events: none; }
    .posbtn:active { transform: translateY(1px); }

    /* ── Station rows ── */
    .rows { display: flex; flex-direction: column; }
    .srow {
      display: grid; grid-template-columns: auto 1fr auto auto; align-items: center;
      gap: 0.6rem; padding: 0.7rem 0.2rem; border-top: 1px solid var(--border); cursor: pointer;
    }
    .srow:first-child { border-top: none; }
    .srow .mi { font-variant-numeric: tabular-nums; font-size: 0.72rem; color: var(--text-muted); font-weight: 700; width: 3.9rem; }
    .srow .nm { font-weight: 700; font-size: 0.92rem; display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
    .srow .nm .crewtag { font-size: 0.58rem; font-weight: 800; letter-spacing: 0.06em; color: var(--orange);
      border: 1px solid var(--orange); border-radius: 5px; padding: 0.05rem 0.25rem; }
    .srow .nm .donetag { font-size: 0.58rem; font-weight: 800; color: var(--green); }
    .srow .proj { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 0.92rem; }
    .srow .proj .day { font-size: 0.6rem; color: var(--text-muted); font-weight: 700; }
    .srow .delta { text-align: right; font-size: 0.75rem; font-weight: 800; font-variant-numeric: tabular-nums; width: 3.4rem; }
    .delta.ahead { color: var(--green); }
    .delta.behind { color: var(--red); }
    .delta.even { color: var(--text-muted); }

    .srow.done { opacity: 0.62; }
    .srow.next { background: var(--amber-bg); margin: 0 -0.5rem; padding-left: 0.7rem; padding-right: 0.7rem; border-radius: 8px; }

    /* expand editor */
    .editor { padding: 0.4rem 0.2rem 0.9rem; border-top: 1px dashed var(--border); }
    .editor .info { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 0.7rem; }
    .editor .info b { color: var(--text); }
    .editor-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .field label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .field input {
      font-size: 1rem; padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: 9px;
      background: var(--card); color: var(--text); font-family: inherit; width: 7.5rem;
    }
    .field input[type=time] { width: 8.5rem; }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .stepper button { width: 2.4rem; height: 2.5rem; border: none; background: var(--card); font-size: 1.2rem; font-weight: 700; color: var(--text); cursor: pointer; }
    .stepper button:active { background: var(--bg); }
    .stepper input { width: 3.6rem; border: none; border-left: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; font-size: 1rem; padding: 0.5rem 0; font-weight: 800; font-family: inherit; }
    .btn {
      border: none; border-radius: 9px; padding: 0.55rem 0.9rem; font-size: 0.85rem; font-weight: 800;
      cursor: pointer; font-family: inherit; background: var(--orange); color: #fff;
    }
    .btn.big { min-height: 2.85rem; padding: 0.75rem 1rem; font-size: 0.92rem; }
    .btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn.block { width: 100%; padding: 0.8rem; font-size: 0.95rem; margin-top: 0.7rem; }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { opacity: 0.5; pointer-events: none; }
    .editor-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap; }
    .editor-actions .btn { flex: 1 1 auto; }
    .quick-actions { display: flex; gap: 0.45rem; flex-wrap: wrap; align-items: center; }
    .quick-actions .btn { padding: 0.5rem 0.7rem; }

    /* ── Pace targets ── */
    .chips { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .chip {
      border: 1px solid var(--border); background: var(--card); border-radius: 999px;
      padding: 0.5rem 0.85rem; font-size: 0.85rem; font-weight: 800; cursor: pointer; font-family: inherit; color: var(--text);
    }
    .chip.active { background: var(--orange); color: #fff; border-color: var(--orange); }
    .buckle-note { font-size: 0.78rem; color: var(--text-muted); margin: -0.2rem 0 0.9rem; line-height: 1.5; }
    table.splits { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    table.splits th { text-align: right; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 800; padding: 0.4rem 0.3rem; border-bottom: 1px solid var(--border); }
    table.splits th:first-child, table.splits td:first-child { text-align: left; }
    table.splits td { padding: 0.5rem 0.3rem; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    table.splits tr.crewrow td { background: #fff7f1; }
    table.splits .stname { font-weight: 700; }
    table.splits .pace { font-weight: 800; }
    .from-here { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
    .from-here input { width: 1.1rem; height: 1.1rem; accent-color: var(--orange); }
    .from-here label { font-size: 0.85rem; font-weight: 700; }

    .help { font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; }
    .help code { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 0.05rem 0.35rem; font-size: 0.74rem; }
    .help a { color: var(--orange); font-weight: 700; }

    .status-line { font-size: 0.78rem; font-weight: 700; margin-top: 0.55rem; }
    .status-line.ok { color: var(--green); }
    .status-line.err { color: var(--red); }
    .status-line.muted { color: var(--text-muted); }
    .status-line.warn { color: var(--amber); }

    .setting { margin-bottom: 1rem; }
    .setting label.lab { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 0.35rem; }
    .setting input[type=text], .setting input[type=time], .setting input[type=date] {
      width: 100%; font-size: 1rem; padding: 0.65rem 0.7rem; border: 1px solid var(--border);
      border-radius: 10px; background: var(--card); color: var(--text); font-family: inherit;
    }
    .sheet-chip { display: flex; align-items: center; gap: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.7rem; margin-bottom: 0.8rem; }
    .sheet-chip .nm { font-weight: 800; font-size: 0.85rem; }
    .sheet-chip .sub { font-size: 0.72rem; color: var(--text-muted); }
    .sheet-chip a { margin-left: auto; font-size: 0.78rem; font-weight: 700; color: var(--orange); text-decoration: none; white-space: nowrap; }
    .row2 { display: flex; gap: 0.6rem; }
    .row2 > * { flex: 1; }

    /* ── Bottom tab bar ── */
    .tabbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: rgba(255,255,255,0.94); backdrop-filter: saturate(180%) blur(10px);
      border-top: 1px solid var(--border);
      display: flex; padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar button {
      flex: 1; background: none; border: none; padding: 0.6rem 0.2rem 0.55rem; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
      color: var(--text-muted); font-family: inherit; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.02em;
    }
    .tabbar button.active { color: var(--orange); }
    .tabbar button svg { width: 22px; height: 22px; }

    .empty { text-align: center; color: var(--text-muted); padding: 2rem 1rem; font-size: 0.9rem; line-height: 1.6; }
    .hidden { display: none !important; }
    .sectiontitle { font-size: 0.95rem; font-weight: 850; margin: 0.2rem 0 0.7rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand-dot"></span>
      <div>
        <h1 id="raceTitle">Western States 100</h1>
        <div class="sub" id="raceSub">Crew tracker</div>
      </div>
      <button id="topRefresh" class="top-refresh" title="Refresh from sheet" aria-label="Refresh from sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v5h-5"/></svg>
      </button>
      <a href="../index.html" class="home-link">All tools</a>
    </div>
  </header>

  <main class="wrap">
    <section id="view-track"></section>
    <section id="view-pace" class="hidden"></section>
    <section id="view-splits" class="hidden"></section>
    <section id="view-data" class="hidden"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="track" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Track
    </button>
    <button data-tab="pace">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-4M12 5V3M9 3h6"/></svg>
      Pace
    </button>
    <button data-tab="splits">

  <script>
  /* ===========================================================================
     HARDCODED DATA STORE — Google Sheet "Crew - app" tab.

       Mile | Crew Stop | ETA | Leave By | Adjust +/- min | Total Adj min |

     =========================================================================== */
  const SHEET = {
    id:   "1WInynSPvtb-TxcRhBhdyVjQ3_XnVHmPPEU_BXfLRdWw",
    gid:  "354419833",
    tab:  "Crew - app",
  };
  const URL_PARAMS = new URLSearchParams(window.location.search);
  const DEMO_MODE = URL_PARAMS.get("demo") === "1";
  const STALE_AFTER_MS = 15 * 60 * 1000;
  const LAST_SHEET_KEY = "ws-crew-last-sheet-v1";
